<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The halting problem diagonal argument</title>
<desc id="d">A table of illustrative Oracle verdicts, Halt or Loop, for four programs p1 to p4 and the program D run on each as input. The diagonal cells are outlined. Row D gives the opposite of each diagonal verdict, so it differs from every row, and its own cell is a question mark: whatever the Oracle says about D on D is wrong.</desc>
