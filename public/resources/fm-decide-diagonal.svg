y="242" width="94" height="38" rx="6" fill="#ff2bd6" fill-opacity="0.14" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="405" y="266.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Loop</text><rect x="462" y="242" width="94" height="38" rx="6" fill="#00ffc8" fill-opacity="0.14" stroke="#00ffc8" stroke-opacity="0.6"/><text x="509" y="266.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Halt</text><rect x="566" y="242" width="94" height="38" rx="6" fill="#ff2bd6" fill-opacity="0.14" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="613" y="266.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Loop</text></g><g id="part4"><rect x="147" y="101" width="100" height="44" rx="8" fill="none" stroke="#ffb547" stroke-width="2.5"/><rect x="251" y="147" width="100" height="44" rx="8" fill="none" stroke="#ffb547" stroke-width="2.5"/><rect x="355" y="193" width="100" height="44" rx="8" fill="none" stroke="#ffb547" stroke-width="2.5"/><rect x="459" y="239" width="100" height="44" rx="8" fill="none" stroke="#ffb547" stroke-width="2.5"/></g><g id="part5"><rect x="150" y="288" width="94" height="38" rx="6" fill="#ff2bd6" fill-opacity="0.14" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="197" y="312.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Loop</text><rect x="254" y="288" width="94" height="38" rx="6" fill="#00ffc8" fill-opacity="0.14" stroke="#00ffc8" stroke-opacity="0.6"/><text x="301" y="312.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Halt</text><rect x="358" y="288" width="94" height="38" rx="6" fill="#00ffc8" fill-opacity="0.14" stroke="#00ffc8" stroke-opacity="0.6"/><text x="405" y="312.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Halt</text><rect x="462" y="288" width="94" height="38" rx="6" fill="#ff2bd6" fill-opacity="0.14" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="509" y="312.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Loop</text></g><g id="part6"><rect x="566" y="288" width="94" height="38" rx="6" fill="#ffb547" fill-opacity="0.18" stroke="#ffb547" stroke-width="2"/><text x="613" y="314" fill="#ffb547" font-size="22" text-anchor="middle" font-weight="700">?</text></g><g id="part7"><text x="24" y="372" fill="#e4f2f0" font-size="13" text-anchor="start">D runs the Oracle on each program and does the opposite, so it differs from every row on the diagonal.</text><text x="24" y="394" fill="#e4f2f0" font-size="13" text-anchor="start">In its own column the Oracle says Halt, so D loops; or says Loop, so D halts. Either answer is wrong.</text></g></defs>
