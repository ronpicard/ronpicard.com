rcle cx="71" cy="78" r="5" fill="#ff2bd6"/><text x="90" y="82" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">Aircraft 2</text><text x="690" y="60" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="end">vertical axis compressed</text><g class="still"><path d="M64 223L298.8 223" fill="none" stroke="#00ffc8" stroke-width="3" stroke-linejoin="round"/><path d="M690 223L455.3 223" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/><use href="#part1"/><path d="M298.8 223L298.8 167.4" fill="none" stroke="#00ffc8" stroke-width="3" stroke-linejoin="round"/><path d="M455.3 223L455.3 278.6" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/><use href="#part3"/><path d="M298.8 167.4L455.3 167.4L455.3 111.8" fill="none" stroke="#00ffc8" stroke-width="3" stroke-linejoin="round"/><path d="M455.3 278.6L298.8 278.6L298.8 334.2" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/><use href="#part5"/><path d="M455.3 111.8L690 111.8L690 223" fill="none" stroke="#00ffc8" stroke-width="3" stroke-linejoin="round"/><path d="M298.8 334.2L64 334.2L64 223" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round"/><use href="#part7"/></g><g class="anim"><path d="M64 223L298.8 223" fill="none" stroke="#00ffc8" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.06;0.2400;1" dur="5s" repeatCount="indefinite"/></path><path d="M690 223L455.3 223" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.06;0.2400;1" dur="5s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.3000;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><path d="M298.8 223L298.8 167.4" f