;0.64;0.8000;1" dur="5s" repeatCount="indefinite"/></path><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.72;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part7"/></g></g><circle cx="64" cy="223" r="5" fill="#00ffc8"/><circle cx="690" cy="223" r="5" fill="#ff2bd6"/><text x="74" y="243" fill="#e4f2f0" font-size="12" text-anchor="start">A1 start,</text><text x="74" y="257" fill="#e4f2f0" font-size="12" text-anchor="start">A2 destination</text><text x="680" y="193" fill="#e4f2f0" font-size="12" text-anchor="end">A2 start,</text><text x="680" y="207" fill="#e4f2f0" font-size="12" text-anchor="end">A1 destination</text></g>
