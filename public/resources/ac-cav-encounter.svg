<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Head-on encounter in the x-y plane</title>
<desc id="d">A schematic of the head-on test. Aircraft 1 starts at (0, 0) and Aircraft 2 at (4000, 0), each flying toward the other's start. Each receives the other's message about 500 m in, sidesteps 1000 m, finds the other still in range, sidesteps 1000 m again, ending 4000 m apart, then both fly on and return to y = 0 at their destinations.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part1"><circle cx="142.3" cy="223" r="5" fill="#00ffc8"/><circle cx="611.8" cy="223" r="5" fill="#ff2bd6"/><text x="142.3" y="209" fill="#e4f2f0" font-size="12" text-anchor="middle">message at x = 500</text><text x="611.8" y="245" fill="#e4f2f0" font-size="12" text-anchor="middle">message at x = 3500</text></g><g id="part3"><text x="377" y="220" fill="#e4f2f0" font-size="12" text-anchor="middle">about 2000 m apart,</text><text x="377" y="236" fill="#e4f2f0" font-size="12" text-anchor="middle">still in range: avoid again</text></g><g id="part5"><text x="533.5" y="164.4" fill="#e4f2f0" font-size="12" text-anchor="middle">4000 m apart,</text><text x="533.5" y="180.4" fill="#e4f2f0" font-size="12" text-anchor="middle">out of range</text></g><g id="part7"><text x="572.6" y="99.8" fill="#e4f2f0" font-size="12" text-anchor="middle">turn at x = 3000, 1000 m before the destination</text></g></defs>
<rect width="720" height="420" fill="#05090c"/>
