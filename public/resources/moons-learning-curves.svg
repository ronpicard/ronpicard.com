<title id="t">Training cost over 850,000 iterations</title>
<desc id="d">Training cost logged every 10,000 iterations for the five runs. Without regularisation the cost falls to 0.107; with L2 it levels at 0.188 (λ 0.10) and 0.279 (λ 0.85), because the penalty is included; the dropout runs are noisy, around 0.7 (keep 0.95) and 1.3 (keep 0.85), since each logged value comes from one randomly thinned network.</desc>
