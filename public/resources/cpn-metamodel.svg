<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The Colored Petri Net meta-model</title>
<desc id="d">A UML-style meta-model. FCO is the root. Colored Petri Net, with attributes ColorSet, InitialState, IsDeterministic, Iteration and StateSpace, contains zero or more Petri Objects. Petri Object is abstract with a Tokens attribute and the constraints NoRepeats and TokenSet. Place, Transition and an abstract Arc inherit from it, and the Arc is specialized into PlaceToTransition and TransitionToPlace connections.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="300" y="48" width="130" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(210,230,225,0.4)"/><line x1="300" y1="74" x2="430" y2="74" stroke="rgba(210,230,225,0.4)"/><text x="365" y="66" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">FCO</text><text x="310" y="92" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">name: string</text></g><g id="part1"><rect x="20" y="150" width="210" height="115" rx="8" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><line x1="20" y1="176" x2="230" y2="176" stroke="#00ffc8"/><text x="125" y="168" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Colored Petri Net</text><text x="30" y="194" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">ColorSet: string</text><text x="30" y="211" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">InitialState: string</text><text x="30" y="228" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">IsDeterministic: string</text><text x="30" y="245" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Iteration: integer</text><text x="30" y="262" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">StateSpace: string</text><rect x="400" y="150" width="210" height="81" rx="8" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><line x1="400" y1="176" x2="610" y2="176" stroke="#ff2bd6"/><text x="505" y="168" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Petri Object (abstract)</text><text x="410" y="194" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Tokens: string</text><text x="410" y="211" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">constraint: NoRepeats</text><text x="410" y="228" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">constraint: TokenSet</text><line x1="125" y1="150" x2="320" y2="98" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="505" y1="150" x2="410" y2="98" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="230" y1="205" x2="400" y2="205" stroke="#ffb547" stroke-width="1.6"/><path d="M230 205l8-5 8 5-8 5z" fill="#ffb547"/><text x="315" y="196" fill="#ffb547" font-size="12" text-anchor="middle">contains 0..*</text></g><g id="part2"><rect x="290" y="290" width="90" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><line x1="290" y1="316" x2="380" y2="316" stroke="rgba(0,255,200,0.22)"/><text x="335" y="308" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Place</text><text x="300" y="334" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start"></text><rect x="395" y="290" width="100" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><line x1="395" y1="316" x2="495" y2="316" stroke="rgba(0,255,200,0.22)"/><text x="445" y="308" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Transition</text><text x="405" y="334" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start"></text><rect x="510" y="290" width="110" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><line x1="510" y1="316" x2="620" y2="316" stroke="rgba(0,255,200,0.22)"/><text x="565" y="308" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Arc (abstract)</text><text x="520" y="334" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start"></text><line x1="335" y1="290" x2="480" y2="238" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="445" y1="290" x2="505" y2="238" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="565" y1="290" x2="535" y2="238" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part3"><rect x="400" y="360" width="130" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><line x1="400" y1="386" x2="530" y2="386" stroke="rgba(0,255,200,0.22)"/><text x="465" y="378" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">PlaceToTransition</text><text x="410" y="404" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">«connection»</text><rect x="560" y="360" width="130" height="47" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><line x1="560" y1="386" x2="690" y2="386" stroke="rgba(0,255,200,0.22)"/><text x="625" y="378" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">TransitionToPlace</text><text x="570" y="404" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">«connection»</text><line x1="465" y1="360" x2="545" y2="330" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="625" y1="360" x2="575" y2="330" stroke="rgba(210,230,225,0.4)" stroke-width="1.6" marker-end="url(#arrow)"/></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="470" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The Colored Petri Net meta-model in WebGME</text><text x="24" y="436" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Tokens means: tokens held (Place), tokens required (Transition),</text><text x="24" y="454" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">capacity (place to transition arc), or weight (transition to place arc).</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.1600;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.3800;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.6000;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part3"/></g></g></g>
</svg>
