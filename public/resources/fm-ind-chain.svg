<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Induction as a chain of cases</title>
<desc id="d">A row of boxes P(0) with sum 0, P(1) with sum 1, P(2) with sum 3, P(3) with sum 6, dots, P(k) assumed and P(k+1) to show. The base case P(0) lights up first; each arrow adds the next number to the sum and lights the next box; the final arrow is the inductive step from P(k) to P(k+1).</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="20" y="110" width="66" height="64" rx="10" fill="#00ffc8" fill-opacity="0.16" stroke="#00ffc8" stroke-width="1.6"/><text x="53" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(0)</text><text x="53" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">sum = 0</text><text x="53" y="96" fill="#00ffc8" font-size="14" text-anchor="middle" font-weight="600">base case</text></g><g id="part1"><line x1="89" y1="142" x2="117" y2="142" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrowT)"/><text x="103" y="102" fill="#00ffc8" font-size="11.5" text-anchor="middle">+ 1</text></g><g id="part2"><rect x="120" y="110" width="66" height="64" rx="10" fill="#00ffc8" fill-opacity="0.16" stroke="#00ffc8" stroke-width="1.6"/><text x="153" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(1)</text><text x="153" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">sum = 1</text></g><g id="part3"><line x1="189" y1="142" x2="217" y2="142" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrowT)"/><text x="203" y="102" fill="#00ffc8" font-size="11.5" text-anchor="middle">+ 2</text></g><g id="part4"><rect x="220" y="110" width="66" height="64" rx="10" fill="#00ffc8" fill-opacity="0.16" stroke="#00ffc8" stroke-width="1.6"/><text x="253" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(2)</text><text x="253" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">sum = 3</text></g><g id="part5"><line x1="289" y1="142" x2="317" y2="142" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrowT)"/><text x="303" y="102" fill="#00ffc8" font-size="11.5" text-anchor="middle">+ 3</text></g><g id="part6"><rect x="320" y="110" width="66" height="64" rx="10" fill="#00ffc8" fill-opacity="0.16" stroke="#00ffc8" stroke-width="1.6"/><text x="353" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(3)</text><text x="353" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">sum = 6</text></g><g id="part7"><line x1="389" y1="142" x2="417" y2="142" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrowT)"/></g><g id="part8"><rect x="420" y="110" width="66" height="64" rx="10" fill="#00ffc8" fill-opacity="0.16" stroke="#00ffc8" stroke-width="1.6"/><text x="453" y="148" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">…</text></g><g id="part9"><line x1="489" y1="142" x2="517" y2="142" stroke="#ffb547" stroke-width="2" marker-end="url(#arrowA)"/></g><g id="part10"><rect x="520" y="110" width="66" height="64" rx="10" fill="#ffb547" fill-opacity="0.16" stroke="#ffb547" stroke-width="1.6"/><text x="553" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(k)</text><text x="553" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">assumed</text></g><g id="part11"><line x1="589" y1="142" x2="617" y2="142" stroke="#ffb547" stroke-width="2" marker-end="url(#arrowA)"/><text x="603" y="102" fill="#ffb547" font-size="11.5" text-anchor="middle">+ (k+1)</text></g><g id="part12"><rect x="620" y="110" width="66" height="64" rx="10" fill="#ffb547" fill-opacity="0.16" stroke="#ffb547" stroke-width="1.6"/><text x="653" y="138" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">P(k+1)</text><text x="653" y="158" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">to show</text></g><g id="part13"><text x="686" y="214" fill="#ffb547" font-size="14" text-anchor="end">inductive step: from P(k) to P(k+1)</text><path d="M520 184V194H686V184" fill="none" stroke="#ffb547" stroke-opacity="0.7"/></g><g id="part14"><text x="24" y="270" fill="#e4f2f0" font-size="14" text-anchor="start">Once the base case and the step are proved, every case P(0), P(1), P(2), … is reached in turn.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="300" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Induction as a chain of cases: P(n) = 0 + 1 + … + n = n(n+1)/2</text><rect x="20" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="53" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(0)</text><rect x="120" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="153" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(1)</text><rect x="220" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="253" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(2)</text><rect x="320" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="353" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(3)</text><rect x="420" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="453" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">…</text><rect x="520" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="553" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(k)</text><rect x="620" y="110" width="66" height="64" rx="10" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="4 4"/><text x="653" y="148" fill="rgba(210,230,225,0.4)" font-size="16" text-anchor="middle" font-weight="600">P(k+1)</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="