imate attributeName="width" values="0;0;34;34" keyTimes="0;0.5354;0.5758;1" dur="4.95s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5657;0.6162;1" dur="4.95s" repeatCount="indefinite"/><use href="#part10"/></g><clipPath id="wipe6"><rect x="586" y="86" width="0" height="92"><animate attributeName="width" values="0;0;34;34" keyTimes="0;0.6162;0.6566;1" dur="4.95s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe6)"><use href="#part11"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6465;0.6970;1" dur="4.95s" repeatCount="indefinite"/><use href="#part12"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6566;0.7576;1" dur="4.95s" repeatCount="indefinite"/><use href="#part13"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7172;0.7980;1" dur="4.95s" repeatCount="indefinite"/><use href="#part14"/></g></g></g>
