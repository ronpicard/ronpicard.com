,225,0.72)" font-size="12" text-anchor="middle">gap 18.3 pts</text><text x="106" y="168.9" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 2</text><line x1="195.4" y1="164.4" x2="586.1" y2="164.4" stroke="rgba(210,230,225,0.55)" stroke-width="3"/><circle cx="195.4" cy="164.4" r="7" fill="#00ffc8"/><circle cx="586.1" cy="164.4" r="7" fill="#ff2bd6"/><text x="390.8" y="154.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">gap 20.9 pts</text><text x="106" y="214.5" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 3</text><line x1="242.6" y1="210" x2="662.8" y2="210" stroke="rgba(210,230,225,0.55)" stroke-width="3"/><circle cx="242.6" cy="210" r="7" fill="#00ffc8"/><circle cx="662.8" cy="210" r="7" fill="#ff2bd6"/><text x="452.7" y="200" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">gap 22.5 pts</text><text x="106" y="260.1" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 4</text><line x1="222.1" y1="255.6" x2="664.1" y2="255.6" stroke="rgba(210,230,225,0.55)" stroke-width="3"/><circle cx="222.1" cy="255.6" r="7" fill="#00ffc8"/><circle cx="664.1" cy="255.6" r="7" fill="#ff2bd6"/><text x="443.1" y="245.6" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">gap 23.7 pts</text><text x="106" y="305.7" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 5</text><line x1="200.3" y1="301.2" x2="554.7" y2="301.2" stroke="rgba(210,230,225,0.55)" stroke-width="3"/><circle cx="200.3" cy="301.2" r="7" fill="#00ffc8"/><circle cx="554.7" cy="301.2" r="7" fill="#ff2bd6"/><text x="377.5" y="291.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">gap 19.0 pts</text><text x="400" y="366" fill="#e4f2f0" font-size="14" text-anchor="middle">accuracy</text>
