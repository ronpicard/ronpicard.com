<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Training vs. test accuracy</title>
<desc id="d">For each trial, a pair of dots joined by a line: training accuracy on the right, test accuracy on the left. The gaps are 18.3 points (trial 1), 20.9 points (trial 2), 22.5 points (trial 3), 23.7 points (trial 4), 19.0 points (trial 5), so every network fits its 11,340 training cells far better than new ones.</desc>
<defs></defs>
<rect width="720" height="380" fill="#05090c"/>
