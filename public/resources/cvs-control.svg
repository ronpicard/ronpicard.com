<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Two controllers, one on/off switch</title>
<desc id="d">The Android app sends a TCP message to a listener thread on the Raspberry Pi. The listener and the touchscreen button both flip a global on/off switch that starts or stops the detection loop. The Pi replies to the app with the string ON or OFF.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="20" y="140" width="150" height="90" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="95" y="181.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Android app</text><text x="95" y="201.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">Java, one button</text></g><g id="part1"><rect x="256" y="92" width="140" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="326" y="123.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Listener thread</text><text x="326" y="143.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">TCP socket</text></g><g id="part2"><line x1="174" y1="165" x2="252" y2="130" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#arrow)"/><text x="176" y="114" fill="#00d4ff" font-size="12" text-anchor="start">TCP message</text></g><g id="part3"><rect x="256" y="232" width="140" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ffb547"/><text x="326" y="263.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Touchscreen</text><text x="326" y="283.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">Tkinter ON/OFF button</text></g><g id="part4"><rect x="450" y="160" width="110" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="505" y="191.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Global switch</text><text x="505" y="211.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">ON / OFF</text></g><g id="part5"><line x1="400" y1="132" x2="446" y2="178" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="400" y1="262" x2="446" y2="214" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="590" y="160" width="104" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="642" y="190.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Detection</text><text x="642" y="209" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">loop</text></g><g id="part7"><line x1="564" y1="195" x2="586" y2="195" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part8"><line x1="252" y1="150" x2="174" y2="190" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="190" y="218" fill="#00d4ff" font-size="12" text-anchor="start">ack: &quot;ON&quot; / &quot;OFF&quot;</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="360" fill="#05090c"/>
