<title id="t">The networks compared</title>
<desc id="d">Three network shapes drawn as bars whose heights grow with layer width. Trial 1 is 54 inputs, 120 hidden units, 7 outputs. Trial 2 adds a 20-unit layer. Trials 3 to 5 use 54, 1024, 512, 216 and 7 units.</desc>
