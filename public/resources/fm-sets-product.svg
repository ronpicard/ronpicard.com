<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Cartesian product of two sets</title>
<desc id="d">A 3 by 3 grid with the rows labelled a, b, c from S and the columns d, e, f from T. Each cell holds one ordered pair, from (a, d) to (c, f), giving 9 pairs in all.</desc>
