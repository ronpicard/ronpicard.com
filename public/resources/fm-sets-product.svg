 rx="8" fill="rgba(0,212,255,0.12)" stroke="#00d4ff" stroke-opacity="0.6"/><text x="470" y="271" fill="#e4f2f0" font-size="19" text-anchor="middle" font-weight="600">(c, f)</text></g><g id="part9"><text x="360" y="344" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="middle">3 × 3 = 9 ordered pairs, one for every choice of an element from S and one from T</text></g></defs>
