<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The relation less-than-or-equal as a graph</title>
<desc id="d">The relation less-than-or-equal on {1, 2, 3} drawn as arrows. Each element has a loop (reflexive), 1 points to 2 and 2 points to 3, and a curved arrow from 1 to 3 is forced by transitivity. No pair of different elements has arrows both ways (antisymmetric) and every two elements are joined (connex).</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><path d="M68 169.1C48.8 125.2 111.2 125.2 92 168.4" fill="none" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowB)"/><path d="M208 169.1C188.8 125.2 251.2 125.2 232 168.4" fill="none" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowB)"/><path d="M348 169.1C328.8 125.2 391.2 125.2 372 168.4" fill="none" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowB)"/><circle cx="446" cy="95" r="6" fill="#00d4ff"/><text x="462" y="100" fill="#e4f2f0" font-size="15" text-anchor="start" font-weight="600">Reflexive</text><text x="462" y="119" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">every element has a loop</text></g><g id="part1"><line x1="106" y1="190" x2="190" y2="190" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrow)"/><line x1="246" y1="190" x2="330" y2="190" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="446" cy="157" r="6" fill="#00ffc8"/><text x="462" y="162" fill="#e4f2f0" font-size="15" text-anchor="start" font-weight="600">Pairs a ≤ b</text><text x="462" y="181" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">1 ≤ 2 and 2 ≤ 3</text></g><g id="part2"><path d="M94.4 210.4Q220 276.4 341.6 212.8" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#arrowA)"/><circle cx="446" cy="219" r="6" fill="#ffb547"/><text x="462" y="224" fill="#e4f2f0" font-size="15" text-anchor="start" font-weight="600">Transitive</text><text x="462" y="243" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">1 ≤ 2 and 2 ≤ 3 force 1 ≤ 3</text></g><g id="part3"><circle cx="446" cy="281" r="6" fill="#a78bfa"/><text x="462" y="286" fill="#e4f2f0" font-size="15" text-anchor="start" font-weight="600">Antisymmetric and connex</text><text x="462" y="305" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">no two-way arrows; any two elements joined</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00d4ff"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="340" fill="#05090c"/>
<g id="play"><text x="24" y="34" fill="#e4f2f0" font-size="16" text-anchor="start" font-weight="600">The relation ≤ on {1, 2, 3}</text><circle cx="80" cy="190" r="24" fill="#0b1316" stroke="rgba(210,230,225,0.55)" stroke-width="1.6"/><text x="80" y="198.4" fill="#e4f2f0" font-size="21.6" text-anchor="middle" font-weight="600">1</text><circle cx="220" cy="190" r="24" fill="#0b1316" stroke="rgba(210,230,225,0.55)" stroke-width="1.6"/><text x="220" y="198.4" fill="#e4f2f0" font-size="21.6" text-anchor="middle" font-weight="600">2</text><circle cx="360" cy="190" r="24" fill="#0b1316" stroke="rgba(210,230,225,0.55)" stroke-width="1.6"/><text x="360" y="198.4" fill="#e4f2f0" font-size="21.6" text-anchor="middle" font-weight="600">3</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.2200;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.4200;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.6200;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part3"/></g></g></g>
</svg>
