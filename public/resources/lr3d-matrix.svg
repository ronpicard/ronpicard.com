<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Every house at once: X θ = predicted prices</title>
<desc id="d">A matrix diagram. X has one row per house with a 1 for the bias, the size and the number of bedrooms. Multiplying X by the 3 by 1 parameter vector theta gives a column of predicted prices, one per house. Below, the gradient of the cost for all three parameters at once: one over m times X transpose times (X theta minus y).</desc>
<defs></defs>
<rect width="720" height="336" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Every house at once: X θ = predicted prices</text><rect x="40" y="70" width="186" height="160" rx="8" fill="rgba(0,212,255,0.05)" stroke="#00d4ff" stroke-width="1.6"/><text x="71" y="95" fill="#e4f2f0" font-size="14" text-anchor="middle">1</text><text x="133" y="95" fill="#e4f2f0" font-size="14" text-anchor="middle">x₁⁽¹⁾</text><text x="195" y="95" fill="#e4f2f0" font-size="14" text-anchor="middle">x₂⁽¹⁾</text><text x="71" y="135" fill="#e4f2f0" font-size="14" text-anchor="middle">1</text><text x="133" y="135" fill="#e4f2f0" font-size="14" text-anchor="middle">x₁⁽²⁾</text><text x="195" y="135" fill="#e4f2f0" font-size="14" text-anchor="middle">x₂⁽²⁾</text><text x="71" y="175" fill="#e4f2f0" font-size="14" text-anchor="middle">⋮</text><text x="133" y="175" fill="#e4f2f0" font-size="14" text-anchor="middle">⋮</text><text x="195" y="175" fill="#e4f2f0" font-size="14" text-anchor="middle">⋮</text><text x="71" y="215" fill="#e4f2f0" font-size="14" text-anchor="middle">1</text><text x="133" y="215" fill="#e4f2f0" font-size="14" text-anchor="middle">x₁⁽ᵐ⁾</text><text x="195" y="215" fill="#e4f2f0" font-size="14" text-anchor="middle">x₂⁽ᵐ⁾</text><text x="133" y="252" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">X: m houses × 3 (bias, size, bedrooms)</text><text x="250" y="155" fill="#e4f2f0" font-size="26" text-anchor="middle">×</text><rect x="280" y="90" width="62" height="120" rx="8" fill="rgba(0,212,255,0.05)" stroke="#ff2bd6" stroke-width="1.6"/><text x="311" y="115" fill="#e4f2f0" font-size="14" text-anchor="middle">θ₀</text><text x="311" y="155" fill="#e4f2f0" font-size="14" text-anchor="middle">θ₁</text><text x="311" y="195" fill="#e4f2f0" font-size="14" text-anchor="middle">θ₂</text><text x="311" y="232" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">θ: 3 × 1</text><text x="372" y="155" fill="#e4f2f0" font-size="26" text-anchor="middle">=</text><rect x="400" y="70" width="80" height="160" rx="8" fill="rgba(0,212,255,0.05)" stroke="#00ffc8" stroke-width="1.6"/><text x="440" y="95" fill="#e4f2f0" font-size="14" text-anchor="middle">ŷ⁽¹⁾</text><text x="440" y="135" fill="#e4f2f0" font-size="14" text-anchor="middle">ŷ⁽²⁾</text><text x="440" y="175" fill="#e4f2f0" font-size="14" text-anchor="middle">⋮</text><text x="440" y="215" fill="#e4f2f0" font-size="14" text-anchor="middle">ŷ⁽ᵐ⁾</text><text x="440" y="252" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">ŷ: m × 1</text><text x="520" y="98" fill="#e4f2f0" font-size="13" text-anchor="start">one row per house:</text><text x="520" y="120" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">ŷ = θ₀ + θ₁·size</text><text x="520" y="140" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">      + θ₂·bedrooms</text><rect x="40" y="268" width="640" height="48" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="360" y="297.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Gradient for all three θ at once:  ∇J = (1/m) Xᵀ (Xθ − y)</text>
</svg>
