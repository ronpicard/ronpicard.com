<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The closed loop on the RC car’s Raspberry Pi</title>
<desc id="d">Block diagram of the hardware loop: a 0.2 m/s reference minus the measured speed goes to a discrete PID controller with P 0.013, I 0.0001, D 0.0002 and N 160.6, then a saturation block, then PWM on GPIO 18 to the motor. An IR slot sensor on GPIO 21 feeds a MATLAB speed function that closes the loop.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><text x="70" y="62" fill="#e4f2f0" font-size="12" text-anchor="middle">reference 0.2 m/s</text><line x1="70" y1="68" x2="70" y2="93" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><circle cx="70" cy="110" r="15" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="70" y="115" fill="#e4f2f0" font-size="15" text-anchor="middle">+</text><text x="58" y="140" fill="#e4f2f0" font-size="14" text-anchor="end">−</text></g><g id="part1"><line x1="89" y1="110" x2="116" y2="110" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="118" y="75" width="112" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="174" y="114.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Discrete PID</text><text x="174" y="158.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">P 0.013, I 0.0001</text><text x="174" y="173" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">D 0.0002, N 160.6</text></g><g id="part2"><line x1="232" y1="110" x2="256" y2="110" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="258" y="75" width="100" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="308" y="114.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Saturation</text><text x="308" y="158.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">valid duty cycles</text><text x="308" y="173" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">only</text></g><g id="part3"><line x1="360" y1="110" x2="384" y2="110" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="386" y="75" width="110" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="441" y="114.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">PWM output</text><text x="441" y="158.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">Raspberry Pi 3B</text><text x="441" y="173" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">GPIO 18</text></g><g id="part4"><line x1="498" y1="110" x2="522" y2="110" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="524" y="75" width="120" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="584" y="114.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Motor and car</text><text x="584" y="158.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">DeepNNCar,</text><text x="584" y="173" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">Titan 550 12T</text></g><g id="part5"><path d="M634 145V200" fill="none" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part6"><rect x="524" y="200" width="120" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="584" y="239.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">IR slot sensor</text><text x="584" y="283.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">one pulse per tire</text><text x="584" y="298" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">revolution, GPIO 21</text></g><g id="part7"><line x1="522" y1="235" x2="436" y2="235" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="240" y="200" width="196" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="338" y="239.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">MATLAB function</text><text x="338" y="283.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">speed = λ · π · d</text><text x="338" y="298" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">from pulse times</text></g><g id="part8"><path d="M238 235H70V127" fill="none" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part9"><text x="150" y="223" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">measured speed</text></g><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The closed loop on the RC car’s Raspberry Pi</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0531;0.1593;1" dur="5.65s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1593;0.2301;1" dur="5.65s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2389;0.3097;1" dur="5.65s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3186;0.3894;1" dur="5.65s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3982;0.4690;1" dur="5.65s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe1"><rect x="620" y="140" width="30" height="0"><animate attributeName="height" values="0;0;65;65" keyTimes="0;0.4779;0.5487;1" dur="5.65s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5487;0.6195;1" dur="5.65s" repeatCount="indefinite"/><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6283;0.7080;1" dur="5.65s" repeatCount="indefinite"/><use href="#part7"/></g><clipPath id="wipe2"><rect x="242" y="120" width="0" height="135"><animate attributeName="x" values="242;242;66;66" keyTimes="0;0.7168;0.8053;1" dur="5.65s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;176;176" keyTimes="0;0.7168;0.8053;1" dur="5.65s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7699;0.8230;1" dur="5.65s" repeatCount="indefinite"/><use href="#part9"/></g></g></g>
</svg>
