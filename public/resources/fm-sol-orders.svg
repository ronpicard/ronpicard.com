<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Each order quantifies one level higher</title>
<desc id="d">Three rows. First-order logic quantifies over single elements of the domain D: one dot is picked out. Second-order logic quantifies over sets of elements: a group of three dots is circled. Third-order logic quantifies over sets of sets: three overlapping groups of dots are circled together.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><text x="24" y="92" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">First-order logic</text><text x="24" y="116" fill="#ffb547" font-size="14" text-anchor="start">∃x, an element of D</text><text x="500" y="98" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">quantifies over</text><text x="500" y="118" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">single elements of D</text><rect x="240" y="65" width="240" height="70" rx="14" fill="rgba(0,255,200,0.03)" stroke="rgba(0,255,200,0.22)"/><circle cx="262" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="302" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="342" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="382" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="422" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="462" cy="100" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="342" cy="100" r="7" fill="#ffb547"/></g><g id="part1"><text x="24" y="207" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Second-order logic</text><text x="24" y="231" fill="#ffb547" font-size="14" text-anchor="start">∃S ⊆ D</text><text x="500" y="213" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">quantifies over</text><text x="500" y="233" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">sets of elements of D</text><rect x="240" y="180" width="240" height="70" rx="14" fill="rgba(0,255,200,0.03)" stroke="rgba(0,255,200,0.22)"/><circle cx="262" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="302" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="342" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="382" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="422" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="462" cy="215" r="7" fill="rgba(210,230,225,0.4)"/><ellipse cx="302" cy="215" rx="62" ry="24" fill="#ffb547" fill-opacity="0.12" stroke="#ffb547" stroke-width="2"/><circle cx="262" cy="215" r="7" fill="#ffb547"/><circle cx="302" cy="215" r="7" fill="#ffb547"/><circle cx="342" cy="215" r="7" fill="#ffb547"/></g><g id="part2"><text x="24" y="322" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Third-order logic</text><text x="24" y="346" fill="#ffb547" font-size="14" text-anchor="start">∃Q, a set of sets</text><text x="500" y="328" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">quantifies over</text><text x="500" y="348" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">sets of sets of elements</text><rect x="240" y="295" width="240" height="70" rx="14" fill="rgba(0,255,200,0.03)" stroke="rgba(0,255,200,0.22)"/><circle cx="262" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="302" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="342" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="382" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="422" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><circle cx="462" cy="330" r="7" fill="rgba(210,230,225,0.4)"/><ellipse cx="302" cy="327" rx="62" ry="24" fill="#00ffc8" fill-opacity="0.12" stroke="#00ffc8" stroke-width="2"/><ellipse cx="382" cy="333" rx="66" ry="26" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6" stroke-width="2"/><ellipse cx="442" cy="327" rx="42" ry="24" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-width="2"/></g></defs>
<rect width="720" height="400" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Each order quantifies one level higher</text><text x="24" y="52" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">D is the domain of discourse; the dots are its elements.</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/></g><g class="anim"><clipPath id="wipe1"><rect x="0" y="70" width="0" height="120"><animate attributeName="width" values="0;0;720;720" keyTimes="0;0.0667;0.2444;1" dur="4.5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part0"/></g><clipPath id="wipe2"><rect x="0" y="185" width="0" height="120"><animate attributeName="width" values="0;0;720;720" keyTimes="0;0.3333;0.5111;1" dur="4.5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part1"/></g><clipPath id="wipe3"><rect x="0" y="300" width="0" height="120"><animate attributeName="width" values="0;0;720;720" keyTimes="0;0.6;0.7778;1" dur="4.5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part2"/></g></g></g>
</svg>
