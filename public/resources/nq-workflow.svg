<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">From algorithm to probability: the PRISM workflow</title>
<desc id="d">Five stages left to right: a Python meta-script writes a PRISM model, PRISM builds the discrete-time Markov chain, a PCTL query asks P=? [F !overall_attack], and the experiment returns the probability that a solution is found against the number of iterations.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="21" y="70" width="118" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="80" y="100.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Python</text><text x="80" y="119" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">meta-script</text><text x="80" y="164.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">writes one model</text><text x="80" y="179" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">per queen count</text></g><g id="part1"><line x1="141" y1="105" x2="159" y2="105" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part2"><rect x="161" y="70" width="118" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="220" y="100.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">PRISM</text><text x="220" y="119" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">model</text><text x="220" y="164.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">one module per queen,</text><text x="220" y="179" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">probabilistic guards</text></g><g id="part3"><line x1="281" y1="105" x2="299" y2="105" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part4"><rect x="301" y="70" width="118" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="360" y="100.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">DTMC</text><text x="360" y="119" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">built by PRISM</text><text x="360" y="164.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">every reachable board</text><text x="360" y="179" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">after each transition</text></g><g id="part5"><line x1="421" y1="105" x2="439" y2="105" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part6"><rect x="441" y="70" width="118" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="500" y="100.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">PCTL</text><text x="500" y="119" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">query</text><text x="500" y="164.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">P=? [ F ! overall_attack ]</text><text x="500" y="179" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">(a solution is reached)</text></g><g id="part7"><line x1="561" y1="105" x2="579" y2="105" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part8"><rect x="581" y="70" width="118" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="640" y="100.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Probability</text><text x="640" y="119" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">vs iterations</text><text x="640" y="164.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">PRISM experiment</text><text x="640" y="179" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">over a counter I</text></g><g id="part9"><path d="M90 340L103.5 326.5L117 314.6L130.5 304L144 294.8L157.5 286.6L171 279.3L184.5 272.9L198 267.3L211.5 262.3L225 257.9L238.5 254.1L252 250.7L265.5 247.6L279 245L292.5 242.6L306 240.6L319.5 238.7L333 237.1L346.5 235.7L360 234.4L373.5 233.3L387 232.4L400.5 231.5L414 230.7L427.5 230.1L441 229.5L454.5 228.9L468 228.5L481.5 228.1L495 227.7L508.5 227.4L522 227.1L535.5 226.9L549 226.6L562.5 226.4L576 226.3L589.5 226.1L603 226L616.5 225.9L630 225.8" fill="none" stroke="#00ffc8" stroke-width="3"/></g><g id="part10"><text x="102" y="229" fill="rgba(210,230,225,0.4)" font-size="11" text-anchor="start">schematic: the paper’s curves rise toward 1</text></g><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="370" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">From algorithm to probability: the PRISM workflow</text><line x1="90" y1="340" x2="630" y2="340" stroke="rgba(210,230,225,0.55)"/><line x1="90" y1="340" x2="90" y2="219" stroke="rgba(210,230,225,0.55)"/><text x="82" y="227" fill="#e4f2f0" font-size="13" text-anchor="end">P</text><text x="82" y="344" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="end">0</text><text x="630" y="358" fill="#e4f2f0" font-size="13" text-anchor="end">iterations I</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/><use href="#part10"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0556;0.1204;1" dur="5.4s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="139" y="70" width="0" height="70"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.1111;0.1667;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1852;0.2500;1" dur="5.4s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe2"><rect x="279" y="70" width="0" height="70"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.2407;0.2963;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3148;0.3796;1" dur="5.4s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe3"><rect x="419" y="70" width="0" height="70"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.3704;0.4259;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4444;0.5093;1" dur="5.4s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe4"><rect x="559" y="70" width="0" height="70"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.5;0.5556;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5741;0.6389;1" dur="5.4s" repeatCount="indefinite"/><use href="#part8"/></g><clipPath id="wipe5"><rect x="90" y="219" width="0" height="127"><animate attributeName="width" values="0;0;540;540" keyTimes="0;0.7037;0.7778;1" dur="5.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7593;0.8148;1" dur="5.4s" repeatCount="indefinite"/><use href="#part10"/></g></g></g>
