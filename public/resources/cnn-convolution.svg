<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">One convolution, worked out</title>
<desc id="d">A 6 by 6 input patch, dark on the left half (0) and bright on the right (9), is convolved with a 3 by 3 vertical-edge kernel whose columns are -1, 0 and 1. The 4 by 4 feature map has 0 where the patch is flat and 27 along the boundary, so the filter responds only to the edge.</desc>
