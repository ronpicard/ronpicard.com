<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Remote client tunnelling into a home VPN</title>
<desc id="d">A remote client connects through an encrypted tunnel on TCP port 1194. The home router forwards that port to the VPN server inside the home network, which assigns the client an address in 10.8.0.0/24 and sends its requests out to websites on the public internet, returning the responses back through the tunnel.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="16" y="100" width="130" height="115" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="81" y="126" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Remote client</text><text x="81" y="146" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">e.g. on public</text><text x="81" y="162" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">WiFi</text></g><g id="part1"><rect x="222" y="100" width="120" height="115" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="282" y="126" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Home router</text><text x="282" y="146" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">forwards port 1194</text><text x="282" y="162" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">to the VPN server</text><rect x="404" y="100" width="118" height="115" rx="10" fill="rgba(0,255,200,0.07)" stroke="#00ffc8"/><text x="463" y="126" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">VPN server</text><text x="463" y="146" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">hands out</text><text x="463" y="162" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">10.8.0.x</text></g><g id="part2"><rect x="148" y="178" width="256" height="30" rx="15" fill="rgba(255,43,214,0.12)" stroke="#ff2bd6" stroke-opacity="0.7"/><line x1="152" y1="193" x2="400" y2="193" stroke="#ff2bd6" stroke-width="2.2" marker-end="url(#arrowM)"/><text x="276" y="236" fill="#ff2bd6" font-size="12" text-anchor="middle">encrypted tunnel, TCP port 1194</text></g><g id="part3"><line x1="524" y1="140" x2="598" y2="140" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowB)"/><text x="561" y="128" fill="#00d4ff" font-size="12" text-anchor="middle">request</text><line x1="598" y1="178" x2="527" y2="178" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#arrowB)" stroke-dasharray="5 4"/><text x="561" y="196" fill="#00d4ff" font-size="12" text-anchor="middle">response</text><rect x="600" y="112" width="104" height="82" rx="10" fill="rgba(0,212,255,0.07)" stroke="#00d4ff"/><text x="652" y="138" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Website</text><text x="652" y="158" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">public internet</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00d4ff"/></marker></defs>
<rect width="720" height="300" fill="#05090c"/>
<g id="play"><text x="360" y="24" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">A remote client reaching the internet through the home VPN</text><rect x="205" y="54" width="330" height="190" rx="14" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="5 5"/><text x="219" y="76" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start" letter-spacing="2">HOME NETWORK</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.2000;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.3800;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe3"><rect x="146" y="170" width="0" height="80"><animate attributeName="width" values="0;0;262;262" keyTimes="0;0.38;0.6000;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part2"/></g><clipPath id="wipe4"><rect x="520" y="100" width="0" height="110"><animate attributeName="width" values="0;0;190;190" keyTimes="0;0.6;0.8000;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part3"/></g></g><text x="360" y="282" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">The client’s browser traffic rides the tunnel; the server sends it on and returns the reply the same way.</text></g>
</svg>
