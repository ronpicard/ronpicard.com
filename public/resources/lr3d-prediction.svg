<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">From a new listing to a price</title>
<desc id="d">Five steps: a new 925 square foot home with 2 bedrooms is normalised with the training means and standard deviations, the model gives -1.296 in normalised units, the scaling is undone with the price standard deviation and mean, and the predicted price is $166,000.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="260" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">From a new listing to a price</text><rect x="24" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="84" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">New home</text><text x="84" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">925 sq ft</text><text x="84" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">2 bedrooms</text><line x1="146" y1="118" x2="160" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="162" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="222" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Normalise</text><text x="222" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">subtract mean,</text><text x="222" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">divide by std</text><line x1="284" y1="118" x2="298" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="360" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Model</text><text x="360" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">θ₀ + θ₁x₁ + θ₂x₂</text><text x="360" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">= −1.296</text><line x1="422" y1="118" x2="436" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="438" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="498" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Undo scaling</text><text x="498" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">× σ_price</text><text x="498" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">+ μ_price</text><line x1="560" y1="118" x2="574" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="576" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="636" y="114.5" fill="#00ffc8" font-size="13" text-anchor="middle" font-weight="600">Prediction</text><text x="636" y="133.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">$166,000</text><text x="24" y="210" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">The model works in normalised units, so −1.296 means “1.3 standard deviations below the average price”.</text><text x="24" y="230" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">The same means and standard deviations from training must be used for every new prediction.</text>
</svg>
