<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">From a new listing to a price</title>
<desc id="d">Five steps: a new 925 square foot home with 2 bedrooms is normalised with the training means and standard deviations, the model gives -1.296 in normalised units, the scaling is undone with the price standard deviation and mean, and the predicted price is $166,000.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="84" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">New home</text><text x="84" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">925 sq ft</text><text x="84" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">2 bedrooms</text></g><g id="part1"><line x1="146" y1="118" x2="160" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part2"><rect x="162" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="222" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Normalise</text><text x="222" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">subtract mean,</text><text x="222" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">divide by std</text></g><g id="part3"><line x1="284" y1="118" x2="298" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part4"><rect x="300" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="360" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Model</text><text x="360" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">θ₀ + θ₁x₁ + θ₂x₂</text><text x="360" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">= −1.296</text></g><g id="part5"><line x1="422" y1="118" x2="436" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="438" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="498" y="114.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Undo scaling</text><text x="498" y="126.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">× σ_price</text><text x="498" y="141" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">+ μ_price</text></g><g id="part7"><line x1="560" y1="118" x2="574" y2="118" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part8"><rect x="576" y="70" width="120" height="96" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="636" y="114.5" fill="#00ffc8" font-size="13" text-anchor="middle" font-weight="600">Prediction</text><text x="636" y="133.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">$166,000</text></g><g id="part9"><text x="24" y="210" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">The model works in normalised units, so −1.296 means “1.3 standard deviations below the average price”.</text><text x="24" y="230" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">The same means and standard deviations from training must be used for every new prediction.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="260" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">From a new listing to a price</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.1800;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe4"><rect x="142" y="108" width="0" height="20"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.16;0.2400;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.3200;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe5"><rect x="280" y="108" width="0" height="20"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.3;0.3800;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.4600;1" dur="5s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe6"><rect x="418" y="108" width="0" height="20"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.44;0.5200;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe6)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.6000;1" dur="5s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe7"><rect x="556" y="108" width="0" height="20"><animate attributeName="width" values="0;0;22;22" keyTimes="0;0.58;0.6600;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe7)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.7400;1" dur="5s" repeatCount="indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part9"/></g></g></g>
</svg>
