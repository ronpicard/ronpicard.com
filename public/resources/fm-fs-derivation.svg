<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">A derivation in a formal system</title>
<desc id="d">Axiom 1, (A and not B) implies C, and axiom 2, (C or D) implies E, feed a substitution step that produces phi, ((A and not B) or D) implies E. Because phi is derived from the axioms, gamma proves phi.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="40" y="90" width="250" height="52" rx="8" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="165" y="121.6" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">(A ∧ ¬B) → C</text><text x="40" y="82" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">1. axiom</text></g><g id="part1"><rect x="40" y="190" width="250" height="52" rx="8" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="165" y="221.6" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">(C ∨ D) → E</text><text x="40" y="182" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">2. axiom</text></g><g id="part2"><line x1="292" y1="116" x2="372" y2="150" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="292" y1="216" x2="372" y2="182" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part3"><rect x="374" y="130" width="130" height="72" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ffb547"/><text x="439" y="161.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">substitute</text><text x="439" y="180" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">1 into 2</text><text x="374" y="122" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">3. rule</text></g><g id="part4"><line x1="506" y1="166" x2="546" y2="166" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/></g><g id="part5"><rect x="548" y="120" width="148" height="92" rx="10" fill="rgba(0,255,200,0.10)" stroke="#00ffc8"/><text x="622" y="161.5" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">((A ∧ ¬B) ∨ D)</text><text x="622" y="181" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">→ E</text><text x="548" y="112" fill="#00ffc8" font-size="14" text-anchor="start" font-weight="600">φ</text></g><g id="part6"><text x="24" y="296" fill="#e4f2f0" font-size="14" text-anchor="start">Every line is an axiom or follows from earlier lines by a rule, so Γ ⊢ φ.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">A derivation: from the axioms Γ to the property φ</text><text x="24" y="54" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="start">Γ = { (A ∧ ¬B) → C, (C ∨ D) → E }</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1731;0.2885;1" dur="5.2s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2885;0.3846;1" dur="5.2s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3846;0.5000;1" dur="5.2s" repeatCount="indefinite"/><use href="#part3"/></g><clipPath id="wipe1"><rect x="504" y="150" width="0" height="32"><animate attributeName="width" values="0;0;44;44" keyTimes="0;0.5;0.5769;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5769;0.7115;1" dur="5.2s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7115;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part6"/></g></g></g>
</svg>
