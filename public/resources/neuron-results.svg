<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Test accuracy on 10,000 unseen digits</title>
<desc id="d">Horizontal bars of test accuracy. Training on 50,000 images at learning rate 0.01 for 300 steps scores 96.40%. 10,000 images for 100 steps scores 92.72%. A learning rate of 0.00001 scores 9.61%, the share of nines in the test set, because it answers &quot;9&quot; every time. Always answering &quot;not a 9&quot; would score 90.39%.</desc>
<defs></defs>
<rect width="720" height="320" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Test accuracy on 10,000 unseen digits</text><line x1="290" y1="50" x2="290" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="290" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">0%</text><line x1="380" y1="50" x2="380" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="380" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">25%</text><line x1="470" y1="50" x2="470" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="470" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">50%</text><line x1="560" y1="50" x2="560" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="560" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">75%</text><line x1="650" y1="50" x2="650" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="650" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">100%</text><text x="278" y="89.3" fill="#e4f2f0" font-size="13" text-anchor="end">50,000 images, α = 0.01, 300 steps</text><rect x="290" y="71.8" width="347" height="26" rx="4" fill="#00ffc8" fill-opacity="0.95"/><text x="645" y="89.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">96.40%</text><text x="278" y="146.8" fill="#e4f2f0" font-size="13" text-anchor="end">10,000 images, α = 0.01, 100 steps</text><rect x="290" y="129.3" width="333.8" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="631.8" y="146.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">92.72%</text><text x="278" y="204.3" fill="#e4f2f0" font-size="13" text-anchor="end">50,000 images, α = 0.00001, 100 steps</text><rect x="290" y="186.8" width="34.6" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="332.6" y="204.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">9.61%</text><text x="278" y="261.8" fill="#e4f2f0" font-size="13" text-anchor="end">always answer “not a 9”</text><rect x="290" y="244.3" width="325.4" height="26" rx="4" fill="rgba(210,230,225,0.4)" fill-opacity="0.6"/><text x="623.4" y="261.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">90.39%</text>
</svg>
