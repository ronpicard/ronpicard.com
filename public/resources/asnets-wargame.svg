ll="rgba(0,255,200,0.11)" stroke="none" stroke-width="2"/><text x="623" y="361" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">10%</text></g><g id="part14"><text x="24" y="416" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Each round the front two fight and the loser is replaced. Outlined: best action while blue has reserves.</text></g></defs>
