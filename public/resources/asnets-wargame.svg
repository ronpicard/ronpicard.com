<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The wargame and its odds</title>
<desc id="d">Top: a blue queue and a red queue of 4th- and 5th-generation fighters facing each other; the front two duel each round. Bottom: a grid of the chance blue wins a duel for each matchup and blue action. While blue has fighters in reserve, stealth is the strongest or joint-strongest action in every matchup (70%, 70%, 90% and 30%), but once blue is down to its last fighter stealth drops to 30%, 30%, 70% and 10%, so the best action depends on the state of the battle.</desc>
<defs></defs>
<rect width="720" height="430" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The wargame: two queues of fighters, one duel per round</text><rect x="250" y="56" width="46" height="30" rx="7" fill="#00d4ff" fill-opacity="0.9" stroke="#00d4ff"/><text x="273" y="76" fill="#05090c" font-size="13" text-anchor="middle" font-weight="700">5th</text><rect x="194" y="56" width="46" height="30" rx="7" fill="#00d4ff" fill-opacity="0.35" stroke="#00d4ff"/><text x="217" y="76" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="700">4th</text><rect x="138" y="56" width="46" height="30" rx="7" fill="#00d4ff" fill-opacity="0.35" stroke="#00d4ff"/><text x="161" y="76" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="700">4th</text><rect x="424" y="56" width="46" height="30" rx="7" fill="#ff2bd6" fill-opacity="0.9" stroke="#ff2bd6"/><text x="447" y="76" fill="#05090c" font-size="13" text-anchor="middle" font-weight="700">4th</text><rect x="480" y="56" width="46" height="30" rx="7" fill="#ff2bd6" fill-opacity="0.35" stroke="#ff2bd6"/><text x="503" y="76" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="700">5th</text><rect x="536" y="56" width="46" height="30" rx="7" fill="#ff2bd6" fill-opacity="0.35" stroke="#ff2bd6"/><text x="559" y="76" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="700">4th</text><text x="330" y="76" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="700">vs</text><text x="160" y="108" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">blue team (the agent)</text><text x="510" y="108" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">red team</text><text x="24" y="140" fill="#e4f2f0" font-size="14" text-anchor="start" font-weight="600">Chance blue wins the duel, by blue action</text><text x="269" y="164" fill="#e4f2f0" font-size="12" text-anchor="middle">short range</text><text x="387" y="164" fill="#e4f2f0" font-size="12" text-anchor="middle">long range</text><text x="505" y="164" fill="#e4f2f0" font-size="12" text-anchor="middle">stealth</text><text x="623" y="164" fill="#e4f2f0" font-size="12" text-anchor="middle">stealth (last fighter)</text><text x="198" y="204" fill="#e4f2f0" font-size="12" text-anchor="end">blue 4th-gen vs 4th-gen</text><rect x="213" y="177" width="112" height="46" rx="6" fill="rgba(0,255,200,0.33)" stroke="none" stroke-width="2"/><text x="269" y="205" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">60%</text><rect x="331" y="177" width="112" height="46" rx="6" fill="rgba(0,255,200,0.242)" stroke="none" stroke-width="2"/><text x="387" y="205" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">40%</text><rect x="449" y="177" width="112" height="46" rx="6" fill="rgba(0,255,200,0.374)" stroke="#00ffc8" stroke-width="2"/><text x="505" y="205" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">70%</text><rect x="567" y="177" width="112" height="46" rx="6" fill="rgba(0,255,200,0.198)" stroke="none" stroke-width="2"/><text x="623" y="205" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">30%</text><text x="198" y="256" fill="#e4f2f0" font-size="12" text-anchor="end">blue 5th-gen vs 5th-gen</text><rect x="213" y="229" width="112" height="46" rx="6" fill="rgba(0,255,200,0.242)" stroke="none" stroke-width="2"/><text x="269" y="257" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">40%</text><rect x="331" y="229" width="112" height="46" rx="6" fill="rgba(0,255,200,0.33)" stroke="none" stroke-width="2"/><text x="387" y="257" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">60%</text><rect x="449" y="229" width="112" height="46" rx="6" fill="rgba(0,255,200,0.374)" stroke="#00ffc8" stroke-width="2"/><text x="505" y="257" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">70%</text><rect x="567" y="229" width="112" height="46" rx="6" fill="rgba(0,255,200,0.198)" stroke="none" stroke-width="2"/><text x="623" y="257" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">30%</text><text x="198" y="308" fill="#e4f2f0" font-size="12" text-anchor="end">blue 5th-gen vs 4th-gen</text><rect x="213" y="281" width="112" height="46" rx="6" fill="rgba(0,255,200,0.374)" stroke="none" stroke-width="2"/><text x="269" y="309" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">70%</text><rect x="331" y="281" width="112" height="46" rx="6" fill="rgba(0,255,200,0.418)" stroke="none" stroke-width="2"/><text x="387" y="309" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">80%</text><rect x="449" y="281" width="112" height="46" rx="6" fill="rgba(0,255,200,0.462)" stroke="#00ffc8" stroke-width="2"/><text x="505" y="309" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">90%</text><rect x="567" y="281" width="112" height="46" rx="6" fill="rgba(0,255,200,0.374)" stroke="none" stroke-width="2"/><text x="623" y="309" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">70%</text><text x="198" y="360" fill="#e4f2f0" font-size="12" text-anchor="end">blue 4th-gen vs 5th-gen</text><rect x="213" y="333" width="112" height="46" rx="6" fill="rgba(0,255,200,0.154)" stroke="none" stroke-width="2"/><text x="269" y="361" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">20%</text><rect x="331" y="333" width="112" height="46" rx="6" fill="rgba(0,255,200,0.198)" stroke="#00ffc8" stroke-width="2"/><text x="387" y="361" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">30%</text><rect x="449" y="333" width="112" height="46" rx="6" fill="rgba(0,255,200,0.198)" stroke="#00ffc8" stroke-width="2"/><text x="505" y="361" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">30%</text><rect x="567" y="333" width="112" height="46" rx="6" fill="rgba(0,255,200,0.11)" stroke="none" stroke-width="2"/><text x="623" y="361" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">10%</text><text x="24" y="416" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Each round the front two fight and the loser is replaced. Outlined: best action while blue has reserves.</text>
