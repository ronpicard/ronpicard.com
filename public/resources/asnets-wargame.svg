<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The wargame and its odds</title>
<desc id="d">Top: a blue queue and a red queue of 4th- and 5th-generation fighters facing each other; the front two duel each round. Bottom: a grid of the chance blue wins a duel for each matchup and blue action. While blue has fighters in reserve, stealth is the strongest or joint-strongest action in every matchup (70%, 70%, 90% and 30%), but once blue is down to its last fighter stealth drops to 30%, 30%, 70% and 10%, so the best action depends on the state of the battle.</desc>
