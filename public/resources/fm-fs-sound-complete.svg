<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Soundness and completeness</title>
<desc id="d">Two boxes, gamma proves phi and gamma entails phi. An arrow from provable to true is soundness; an arrow back from true to provable is strong completeness. Below, the three formulas for soundness, strong completeness and refutation-completeness.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="40" y="100" width="220" height="90" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="150" y="139" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">Γ ⊢ φ</text><text x="150" y="165" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">provable from Γ</text></g><g id="part1"><rect x="440" y="100" width="250" height="90" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="565" y="139" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">Γ ⊨ φ</text><text x="565" y="165" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">true in every model of Γ</text></g><g id="part2"><line x1="264" y1="128" x2="436" y2="128" stroke="#00ffc8" stroke-width="2.5" marker-end="url(#arrowT)"/><text x="350" y="114" fill="#00ffc8" font-size="15" text-anchor="middle" font-weight="600">soundness</text></g><g id="part3"><line x1="436" y1="164" x2="264" y2="164" stroke="#ff2bd6" stroke-width="2.5" marker-end="url(#arrowM)"/><text x="350" y="190" fill="#ff2bd6" font-size="15" text-anchor="middle" font-weight="600">strong completeness</text></g><g id="part4"><text x="24" y="262" fill="#e4f2f0" font-size="14" text-anchor="start">Soundness: (Γ ⊢ φ) → (Γ ⊨ φ). Nothing false can be proved.</text><text x="24" y="288" fill="#e4f2f0" font-size="14" text-anchor="start">Strong completeness: (Γ ⊨ φ) → (Γ ⊢ φ). Every semantic truth can be proved.</text><text x="24" y="314" fill="#e4f2f0" font-size="14" text-anchor="start">Refutation-complete: (Γ ⊨ ⊥) → (Γ ⊢ ⊥). Every unsatisfiable Γ derives false.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker></defs>
<rect width="720" height="360" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Soundness and completeness connect ⊢ and ⊨</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1731;0.2885;1" dur="5.2s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe2"><rect x="262" y="100" width="0" height="40"><animate attributeName="width" values="0;0;176;176" keyTimes="0;0.2885;0.4615;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part2"/></g><clipPath id="wipe3"><rect x="438" y="140" width="0" height="60"><animate attributeName="x" values="438;438;262;262" keyTimes="0;0.4615;0.6346;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;176;176" keyTimes="0;0.4615;0.6346;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6346;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g></g></g>
</svg>
