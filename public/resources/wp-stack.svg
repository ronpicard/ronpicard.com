<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The WordPress stack</title>
<desc id="d">A browser looks up the domain through a DNS record that points to the VPS IP address. On the Ubuntu VPS, the Apache web server hands requests to PHP, which runs WordPress from /var/www/html. WordPress reads and writes a MySQL database named wordpress.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="150" width="120" height="64" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff" stroke-opacity="0.8"/><text x="84" y="178" fill="#00d4ff" font-size="16" text-anchor="middle" font-weight="700">Browser</text><text x="84" y="198" fill="#e4f2f0" font-size="11.5" text-anchor="middle">types foo.com</text></g><g id="part1"><line x1="146" y1="182" x2="194" y2="156" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="24" y="228" fill="rgba(210,230,225,0.4)" font-size="11" text-anchor="start">DNS record:</text><text x="24" y="242" fill="rgba(210,230,225,0.4)" font-size="11" text-anchor="start">foo.com → VPS IP</text></g><g id="part2"><rect x="196" y="110" width="120" height="82" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6" stroke-opacity="0.8"/><text x="256" y="138" fill="#ff2bd6" font-size="16" text-anchor="middle" font-weight="700">Apache</text><text x="256" y="158" fill="#e4f2f0" font-size="11.5" text-anchor="middle">web server</text><text x="256" y="175" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">HTTPS via certbot</text></g><g id="part3"><line x1="318" y1="151" x2="354" y2="151" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="336" y="100" fill="rgba(210,230,225,0.4)" font-size="11" text-anchor="middle">runs</text></g><g id="part4"><rect x="356" y="110" width="128" height="82" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ffb547" stroke-opacity="0.8"/><text x="420" y="138" fill="#ffb547" font-size="16" text-anchor="middle" font-weight="700">PHP</text><text x="420" y="158" fill="#e4f2f0" font-size="11.5" text-anchor="middle">libapache2-mod-php</text></g><g id="part5"><line x1="486" y1="151" x2="522" y2="151" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="524" y="110" width="150" height="82" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8" stroke-opacity="0.8"/><text x="599" y="138" fill="#00ffc8" font-size="16" text-anchor="middle" font-weight="700">WordPress</text><text x="599" y="158" fill="#e4f2f0" font-size="11.5" text-anchor="middle">/var/www/html</text><text x="599" y="175" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">wp-config.php</text></g><g id="part7"><line x1="599" y1="194" x2="599" y2="224" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/><text x="609" y="214" fill="rgba(210,230,225,0.4)" font-size="11" text-anchor="start">queries</text></g><g id="part8"><rect x="524" y="226" width="150" height="82" rx="10" fill="rgba(0,255,200,0.035)" stroke="#a78bfa" stroke-opacity="0.8"/><text x="599" y="254" fill="#a78bfa" font-size="16" text-anchor="middle" font-weight="700">MySQL</text><text x="599" y="274" fill="#e4f2f0" font-size="11.5" text-anchor="middle">database: wordpress</text><text x="599" y="291" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">user: wordpressuser</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="360" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The stack this tutorial builds</text><rect x="176" y="62" width="520" height="262" rx="14" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="5 5"/><text x="192" y="84" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">your VPS, running Ubuntu</text><text x="24" y="344" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">Firewall (ufw) allows ports 22, 80 and 443.</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1250;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="0" y="140" width="0" height="120"><animate attributeName="width" values="0;0;196;196" keyTimes="0;0.1442;0.2404;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2404;0.3077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe2"><rect x="316" y="100" width="0" height="80"><animate attributeName="width" values="0;0;42;42" keyTimes="0;0.3269;0.3942;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4038;0.4712;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe3"><rect x="484" y="130" width="0" height="40"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.4904;0.5577;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5673;0.6346;1" dur="5.2s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe4"><rect x="590" y="192" width="90" height="0"><animate attributeName="height" values="0;0;34;34" keyTimes="0;0.6538;0.7308;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7404;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part8"/></g></g></g>
</svg>
