<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The closed loop in the Simulink model</title>
<desc id="d">Block diagram: a reference of 60 minus the measured speed gives an error that feeds the particle filter controller, then a saturation block from -4570 to 4000 newtons, then the vehicle plant. Uniform sensor noise of plus or minus 0.1 is added to the speed, which is fed back.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><text x="24" y="125" fill="#e4f2f0" font-size="13" text-anchor="start">reference 60</text><line x1="100" y1="120" x2="120" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><circle cx="137" cy="120" r="15" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="137" y="125" fill="#e4f2f0" font-size="15" text-anchor="middle">+</text><text x="134" y="149" fill="#e4f2f0" font-size="14" text-anchor="end">−</text></g><g id="part1"><line x1="154" y1="120" x2="178" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><text x="166" y="110" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">error</text></g><g id="part2"><rect x="180" y="75" width="150" height="90" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="255" y="97.8" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Particle filter</text><text x="255" y="116" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">controller</text><text x="255" y="140.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">estimates m and b,</text><text x="255" y="155" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">sets the control law</text></g><g id="part3"><line x1="332" y1="120" x2="352" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="354" y="85" width="100" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="404" y="116.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Saturation</text><text x="404" y="136.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">−4570 to 4000 N</text></g><g id="part4"><line x1="456" y1="120" x2="476" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="478" y="85" width="120" height="70" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="538" y="116.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Vehicle plant</text><text x="538" y="136.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">m v̇ + b v = u</text></g><g id="part5"><line x1="600" y1="120" x2="618" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><circle cx="634" cy="120" r="15" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="634" y="125" fill="#e4f2f0" font-size="15" text-anchor="middle">+</text><line x1="634" y1="68" x2="634" y2="103" stroke="#ffb547" stroke-width="1.6" marker-end="url(#arrA)"/><text x="634" y="62" fill="#ffb547" font-size="11" text-anchor="middle">sensor noise ±0.1</text><line x1="651" y1="120" x2="700" y2="120" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/><text x="700" y="110" fill="#e4f2f0" font-size="13" text-anchor="end">speed</text></g><g id="part6"><path d="M676 120V210H137V137" fill="none" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part7"><text x="410" y="232" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">measured speed fed back and subtracted from the reference</text></g><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The closed loop in the Simulink model</text><text x="24" y="250" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">The particle filter has no access to the true m and b. It sees only the speed error.</text><text x="24" y="272" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">True plant: m = 1000 kg, b = 50 N·s/m. Reference 60, which is 26.8224 m/s.</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1538;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="154" y="100" width="0" height="30"><animate attributeName="width" values="0;0;26;26" keyTimes="0;0.1538;0.2115;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2115;0.3269;1" dur="5.2s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3269;0.4423;1" dur="5.2s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4423;0.5577;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5577;0.6731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part5"/></g><clipPath id="wipe2"><rect x="677" y="120" width="0" height="100"><animate attributeName="x" values="677;677;137;137" keyTimes="0;0.6731;0.7885;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;540;540" keyTimes="0;0.6731;0.7885;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part7"/></g></g></g>
</svg>
