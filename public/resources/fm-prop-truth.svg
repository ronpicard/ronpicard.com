<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Truth table of the propositional operators</title>
<desc id="d">A truth table with columns A, B, not A, A and B, A or B, A implies B, A if and only if B. For A and B both true: not A false, and true, or true, implies true, iff true. A true B false: false, false, true, false, false. A false B true: true, false, true, true, false. Both false: true, false, false, true, true.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="45" y="116" width="630" height="46" rx="8" fill="rgba(0,255,200,0.05)"/><text x="90" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="180" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="270" y="146" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="360" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="450" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="540" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="630" y="146" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text></g><g id="part1"><rect x="45" y="166" width="630" height="46" rx="8" fill="rgba(0,255,200,0.05)"/><text x="90" y="196" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="180" y="196" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="270" y="196" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="360" y="196" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="450" y="196" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="540" y="196" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="630" y="196" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text></g><g id="part2"><rect x="45" y="216" width="630" height="46" rx="8" fill="rgba(0,255,200,0.05)"/><text x="90" y="246" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="180" y="246" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="270" y="246" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="360" y="246" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="450" y="246" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="540" y="246" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="630" y="246" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text></g><g id="part3"><rect x="45" y="266" width="630" height="46" rx="8" fill="rgba(0,255,200,0.05)"/><text x="90" y="296" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="180" y="296" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="270" y="296" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="360" y="296" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="450" y="296" fill="#ff2bd6" font-size="20" text-anchor="middle" font-weight="700">F</text><text x="540" y="296" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text><text x="630" y="296" fill="#00ffc8" font-size="20" text-anchor="middle" font-weight="700">T</text></g></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="360" y="36" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">Truth tables for A, B and the five operators</text><text x="90" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A</text><text x="180" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">B</text><text x="270" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">¬A</text><text x="360" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A ∧ B</text><text x="450" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A ∨ B</text><text x="540" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A → B</text><text x="630" y="100" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A ↔ B</text><line x1="45" y1="114" x2="675" y2="114" stroke="rgba(210,230,225,0.55)"/><line x1="225" y1="76" x2="225" y2="314" stroke="rgba(0,255,200,0.22)"/><text x="360" y="316" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="middle">T = true, F = false. Rows list every combination of values for A and B.</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0899;0.2022;1" dur="4.45s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2809;0.3933;1" dur="4.45s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4719;0.5843;1" dur="4.45s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6629;0.7753;1" dur="4.45s" repeatCount="indefinite"/><use href="#part3"/></g></g></g>
</svg>
