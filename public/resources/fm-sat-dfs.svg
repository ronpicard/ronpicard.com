<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Depth-first search: dead ends, backtracking, then SAT</title>
<desc id="d">A binary search tree over variables A, B and C for the predicate not-A and B and C. Depth-first search follows A=0, B=0, C=0 and reaches a 0 leaf, backtracks, tries C=1, another 0 leaf, backtracks to B, tries B=1, C=0 (a 0 leaf), backtracks, then C=1 reaches the single 1 leaf, the satisfying assignment A=0, B=1, C=1, after visiting 8 nodes. The A=1 half is never explored.</desc>
