<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">DPLL(T) with linear integer arithmetic (LIA)</title>
<desc id="d">A flow of five boxes. The SMT formula (X+1 &gt;= 0) and (X+Y &gt;= 3) and not (X-Y &gt;= 10) is abstracted to a Boolean formula P = A and B and not C. A DPLL SAT solver finds the candidate A true, B true, C false. The theory solver for linear integer arithmetic checks the candidate. If the candidate is consistent, X = 5 and Y = 4 satisfy it and P is satisfiable. If not, the assignment is blocked and the solver backtracks to DPLL.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="70" width="208" height="92" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="36" y="92" fill="#e4f2f0" font-size="13.5" text-anchor="start" font-weight="600">1. SMT formula</text><text x="36" y="114" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">(X + 1 ≥ 0) ∧ (X + Y ≥ 3)</text><text x="36" y="132" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">∧ ¬(X − Y ≥ 10)</text></g><g id="part1"><line x1="232" y1="116" x2="254" y2="116" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#ar)"/></g><g id="part2"><rect x="258" y="70" width="208" height="92" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="270" y="92" fill="#e4f2f0" font-size="13.5" text-anchor="start" font-weight="600">2. Boolean abstraction</text><text x="270" y="114" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">A = (X + 1 ≥ 0), B = (X + Y ≥ 3),</text><text x="270" y="132" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">C = (X − Y ≥ 10), P = A ∧ B ∧ ¬C</text></g><g id="part3"><line x1="466" y1="116" x2="488" y2="116" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#ar)"/></g><g id="part4"><rect x="492" y="70" width="204" height="92" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="504" y="92" fill="#e4f2f0" font-size="13.5" text-anchor="start" font-weight="600">3. DPLL on P</text><text x="504" y="114" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">assume A, B, ¬C all true:</text><text x="504" y="132" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">A = T, B = T, C = F</text></g><g id="part5"><line x1="594" y1="164" x2="594" y2="236" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#ar)"/><text x="604" y="205" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">candidate</text></g><g id="part6"><rect x="492" y="240" width="204" height="92" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="504" y="262" fill="#e4f2f0" font-size="13.5" text-anchor="start" font-weight="600">4. Theory solver for LIA</text><text x="504" y="284" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">X ≥ −1, X + Y ≥ 3,</text><text x="504" y="302" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">X − Y &lt; 10: consistent?</text></g><g id="part7"><line x1="488" y1="286" x2="470" y2="286" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#at)"/><text x="480" y="276" fill="#00ffc8" font-size="12.5" text-anchor="middle">yes</text></g><g id="part8"><rect x="258" y="240" width="208" height="92" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="270" y="262" fill="#e4f2f0" font-size="13.5" text-anchor="start" font-weight="600">5. Satisfiable</text><text x="270" y="284" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">X = 5, Y = 4 satisfies all three</text><text x="270" y="302" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">inequalities, so P is SAT</text></g><g id="part9"><path d="M532 236C532 200 532 200 532 166" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ay)"/><text x="500" y="212" fill="#ffb547" font-size="12.5" text-anchor="end">no: block it, backtrack</text></g><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="360" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">DPLL(T) with linear integer arithmetic (LIA)</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1538;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="232" y="100" width="0" height="30"><animate attributeName="width" values="0;0;28;28" keyTimes="0;0.1538;0.2115;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2115;0.3077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe2"><rect x="466" y="100" width="0" height="30"><animate attributeName="width" values="0;0;28;28" keyTimes="0;0.3077;0.3654;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3654;0.4615;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe3"><rect x="580" y="160" width="120" height="0"><animate attributeName="height" values="0;0;80;80" keyTimes="0;0.4615;0.5192;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5192;0.6154;1" dur="5.2s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe4"><rect x="494" y="262" width="0" height="40"><animate attributeName="x" values="494;494;466;466" keyTimes="0;0.6154;0.6731;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;28;28" keyTimes="0;0.6154;0.6731;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6731;0.7692;1" dur="5.2s" repeatCount="indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7692;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part9"/></g></g></g>
</svg>
