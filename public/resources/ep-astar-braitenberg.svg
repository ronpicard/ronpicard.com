<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Braitenberg line-following controller</title>
<desc id="d">Block diagram. The left and right ground sensors feed a difference block, multiplied by a gain between 0 and 1 (0.3 in the final tuning). The left wheel gets the standard speed minus gain times the difference, and the right wheel the standard speed plus gain times the difference. The centre sensor is used for node detection.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="84" width="150" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="99" y="108.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Left ground sensor</text><text x="99" y="127.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">low over the tape</text><rect x="24" y="196" width="150" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="99" y="220.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Right ground sensor</text><text x="99" y="239.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">low over the tape</text><rect x="24" y="290" width="150" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(210,230,225,0.4)"/><text x="99" y="314.6" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle" font-weight="600">Centre sensor</text><text x="99" y="333.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">used for node detection</text></g><g id="part1"><line x1="174" y1="112" x2="232" y2="154" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="174" y1="224" x2="232" y2="182" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part2"><rect x="232" y="138" width="130" height="60" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="297" y="164.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Difference</text><text x="297" y="183.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">left minus right</text></g><g id="part3"><line x1="362" y1="168" x2="410" y2="168" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part4"><rect x="410" y="138" width="110" height="60" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="465" y="164.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">x Gain</text><text x="465" y="183.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">0 to 1; 0.3 tuned</text></g><g id="part5"><line x1="520" y1="150" x2="566" y2="110" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="520" y1="186" x2="566" y2="226" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="566" y="84" width="130" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="631" y="116.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Left wheel</text><rect x="566" y="196" width="130" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="631" y="228.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Right wheel</text></g><g id="part7"><text x="631" y="160" fill="#e4f2f0" font-size="12" text-anchor="middle">Standard_Speed</text><text x="631" y="176" fill="#e4f2f0" font-size="12" text-anchor="middle">- Gain x (L - R)</text><text x="631" y="272" fill="#e4f2f0" font-size="12" text-anchor="middle">Standard_Speed</text><text x="631" y="288" fill="#e4f2f0" font-size="12" text-anchor="middle">+ Gain x (L - R)</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="400" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Braitenberg line following: one signal steers both wheels</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.1800;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.2600;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.24;0.3400;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.4000;1" dur="5s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.4800;1" dur="5s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.5600;1" dur="5s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.54;0.6400;1" dur="5s" repeatCount="indefinite"/><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part7"/></g></g><text x="24" y="382" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">If the robot veers one way the difference flips sign and speeds up the opposite wheel, so it always steers back.</text></g>
</svg>
