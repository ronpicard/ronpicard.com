<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">How P, NP and the NP-complete problems nest</title>
<desc id="d">P is a small region inside the larger region NP. The NP-Hard region is drawn as a dashed ellipse across the top of the picture, overlapping the top of NP; the overlap is NP-Complete. Callouts on the right say what each region means: P can be solved in polynomial time, NP problems can be turned into an NP-Complete problem in polynomial time, NP-Complete problems have no known polynomial-time algorithm but solutions can be verified in polynomial time, and NP-Hard is NP-Complete or harder.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><ellipse cx="230" cy="338" rx="92" ry="40" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6" stroke-width="2"/><text x="230" y="343" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">P</text><line x1="322" y1="338" x2="468" y2="338" stroke="#ff2bd6" stroke-opacity="0.7"/><circle cx="322" cy="338" r="3" fill="#ff2bd6"/><text x="480" y="342" fill="#e4f2f0" font-size="12.5" text-anchor="start">Can be solved in</text><text x="480" y="359" fill="#e4f2f0" font-size="12.5" text-anchor="start">polynomial time</text></g><g id="part1"><ellipse cx="230" cy="262" rx="200" ry="130" fill="#00d4ff" fill-opacity="0.07" stroke="#00d4ff" stroke-width="2"/><text x="230" y="262" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">NP</text><line x1="350" y1="255" x2="468" y2="255" stroke="#00d4ff" stroke-opacity="0.7"/><circle cx="350" cy="255" r="3" fill="#00d4ff"/><text x="480" y="259" fill="#e4f2f0" font-size="12.5" text-anchor="start">Can be turned into an NP-Complete</text><text x="480" y="276" fill="#e4f2f0" font-size="12.5" text-anchor="start">problem in polynomial time</text></g><g id="part2"><g clip-path="url(#npc)"><ellipse cx="230" cy="112" rx="215" ry="98" fill="#00ffc8" fill-opacity="0.25" stroke="#00ffc8" stroke-width="2"/></g><text x="230" y="178" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">NP-Complete</text><line x1="315" y1="175" x2="468" y2="170" stroke="#00ffc8" stroke-opacity="0.7"/><circle cx="315" cy="175" r="3" fill="#00ffc8"/><text x="480" y="174" fill="#e4f2f0" font-size="12.5" text-anchor="start">No polynomial-time algorithm known</text><text x="480" y="191" fill="#e4f2f0" font-size="12.5" text-anchor="start">(e.g. SAT), but a solution can be</text><text x="480" y="208" fill="#e4f2f0" font-size="12.5" text-anchor="start">verified in polynomial time. The</text><text x="480" y="225" fill="#e4f2f0" font-size="12.5" text-anchor="start">hardest problems in NP.</text></g><g id="part3"><ellipse cx="230" cy="112" rx="215" ry="98" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="2" stroke-dasharray="9 6"/><text x="230" y="70" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">NP-Hard</text><line x1="300" y1="70" x2="468" y2="72" stroke="rgba(210,230,225,0.55)" stroke-opacity="0.7"/><circle cx="300" cy="70" r="3" fill="rgba(210,230,225,0.55)"/><text x="480" y="76" fill="#e4f2f0" font-size="12.5" text-anchor="start">NP-Complete problems and</text><text x="480" y="93" fill="#e4f2f0" font-size="12.5" text-anchor="start">anything harder than them</text></g><clipPath id="npc"><ellipse cx="230" cy="262" rx="200" ry="130" /></clipPath></defs>
<rect width="720" height="420" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">How P, NP and the NP-complete problems nest</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0638;0.2128;1" dur="4.7s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2128;0.4043;1" dur="4.7s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4043;0.5957;1" dur="4.7s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5957;0.7872;1" dur="4.7s" repeatCount="indefinite"/><use href="#part3"/></g></g></g>
</svg>
