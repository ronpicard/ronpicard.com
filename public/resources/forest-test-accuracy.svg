<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Test accuracy on 569,672 held-out forest cells</title>
<desc id="d">Horizontal bars of test accuracy. The earlier single-hidden-layer network from Blackard et al. scores 70.58%. The five new networks score 74.70% (trial 1), 74.04% (trial 2), 76.57% (trial 3), 75.47% (trial 4), 74.30% (trial 5). Trial 3, the 54-1024-512-216-7 network, is best.</desc>
<defs></defs>
<rect width="720" height="380" fill="#05090c"/>
