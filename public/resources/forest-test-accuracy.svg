#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="250" y="67.2" width="211.6" height="26" rx="4" fill="rgba(210,230,225,0.4)" fill-opacity="0.6"/><text x="469.6" y="84.7" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">70.58%</text></g><g id="part1"><rect x="250" y="115.5" width="294" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="552" y="133" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">74.70%</text></g><g id="part2"><rect x="250" y="163.8" width="280.8" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="538.8" y="181.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">74.04%</text></g><g id="part3"><rect x="250" y="212.2" width="331.4" height="26" rx="4" fill="#00ffc8" fill-opacity="0.95"/><text x="589.4" y="229.7" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">76.57%</text></g><g id="part4"><rect x="250" y="260.5" width="309.4" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="567.4" y="278" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">75.47%</text></g><g id="part5"><rect x="250" y="308.8" width="286" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="544" y="326.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">74.30%</text></g></defs>
<rect width="720" height="380" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Test accuracy on 569,672 held-out forest cells</text><line x1="250" y1="50" x2="250" y2="346" stroke="rgba(0,255,200,0.10)"/><text x="250" y="366" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">60%</text><line x1="350" y1="50" x2="350" y2="346" stroke="rgba(0,255,200,0.10)"/><text x="350" y="366" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">65%</text><line x1="450" y1="50" x2="450" y2="346" stroke="rgba(0,255,200,0.10)"/><text x="450" y="366" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">70%</text><line x1="550" y1="50" x2="550" y2="346" stroke="rgba(0,255,200,0.10)"/><text x="550" y="366" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">75%</text><line x1="650" y1="50" x2="650" y2="346" stroke="rgba(0,255,200,0.10)"/><text x="650" y="366" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">80%</text><text x="238" y="84.7" fill="#e4f2f0" font-size="13" text-anchor="end">Blackard et al. (54-120-7)</text><text x="238" y="133" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 1: 54-120-7</text><text x="238" y="181.3" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 2: 54-120-20-7</text><text x="238" y="229.7" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 3: 54-1024-512-216-7</text><text x="238" y="278" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 4: 54-1024-512-216-7</text><text x="238" y="326.3" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 5: 54-1024-512-216-7</text><text x="696" y="30" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="end">axis starts at 60%</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/></g><g class="anim"><clipPath id="wipe1"><rect x="250" y="56" width="0" height="48.3"><animate attributeName="width" values="0;0;470;470" key