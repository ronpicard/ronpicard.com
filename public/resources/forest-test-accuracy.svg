t x="250" y="212.2" width="331.4" height="26" rx="4" fill="#00ffc8" fill-opacity="0.95"/><text x="589.4" y="229.7" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">76.57%</text><text x="238" y="278" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 4: 54-1024-512-216-7</text><rect x="250" y="260.5" width="309.4" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="567.4" y="278" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">75.47%</text><text x="238" y="326.3" fill="#e4f2f0" font-size="13" text-anchor="end">Trial 5: 54-1024-512-216-7</text><rect x="250" y="308.8" width="286" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="544" y="326.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">74.30%</text><text x="696" y="30" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="end">axis starts at 60%</text>
