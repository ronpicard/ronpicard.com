<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">A transition fires</title>
<desc id="d">A Petri net before and after firing. Before: place p1 holds 2 tokens, p2 holds 2, p3 holds 0, and the transition has threshold 2, so it is enabled. Arc capacities are 2 from p1 and 1 from p2, and the arc weight to p3 is 2. After firing: p1 holds 0, p2 holds 1, p3 holds 2, and the transition is no longer enabled.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><circle cx="80" cy="120" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="80" cy="230" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="300" cy="175" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><rect x="185" y="140" width="10" height="70" rx="2" fill="#e4f2f0"/><line x1="108.6" y1="134.3" x2="182" y2="171" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="108.6" y1="215.7" x2="182" y2="179" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="196" y1="175" x2="265" y2="175" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="132" y="134" fill="#ffb547" font-size="14" text-anchor="start">2</text><text x="132" y="226" fill="#ffb547" font-size="14" text-anchor="start">1</text><text x="248" y="166" fill="#ffb547" font-size="14" text-anchor="start">2</text><text x="190" y="140" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">t = 2</text><text x="80" y="82" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p1</text><text x="80" y="192" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p2</text><text x="300" y="137" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p3</text><circle cx="70" cy="120" r="6" fill="#00ffc8"/><circle cx="90" cy="120" r="6" fill="#00ffc8"/><circle cx="70" cy="230" r="6" fill="#00ffc8"/><circle cx="90" cy="230" r="6" fill="#00ffc8"/><text x="180" y="285" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Before: enabled</text><text x="180" y="305" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">both inputs can supply the threshold of 2</text></g><g id="part1"><line x1="352" y1="175" x2="392" y2="175" stroke="#ffb547" stroke-width="2.4" marker-end="url(#arrowA)"/><text x="372" y="160" fill="#ffb547" font-size="13" text-anchor="middle">fire</text></g><g id="part2"><circle cx="440" cy="120" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="440" cy="230" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="660" cy="175" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><rect x="545" y="140" width="10" height="70" rx="2" fill="#e4f2f0"/><line x1="468.6" y1="134.3" x2="542" y2="171" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="468.6" y1="215.7" x2="542" y2="179" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="556" y1="175" x2="625" y2="175" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="492" y="134" fill="#ffb547" font-size="14" text-anchor="start">2</text><text x="492" y="226" fill="#ffb547" font-size="14" text-anchor="start">1</text><text x="608" y="166" fill="#ffb547" font-size="14" text-anchor="start">2</text><text x="550" y="140" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">t = 2</text><text x="440" y="82" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p1</text><text x="440" y="192" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p2</text><text x="660" y="137" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p3</text><circle cx="440" cy="230" r="6" fill="#00ffc8"/><circle cx="650" cy="175" r="6" fill="#00ffc8"/><circle cx="670" cy="175" r="6" fill="#00ffc8"/><text x="540" y="285" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">After: disabled</text><text x="540" y="305" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">p1 gave 2, p2 gave 1, p3 received 2</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">A transition fires: tokens leave by capacity, arrive by weight</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0682;0.2727;1" dur="4.4s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="346" y="150" width="0" height="40"><animate attributeName="width" values="0;0;52;52" keyTimes="0;0.3182;0.4545;1" dur="4.4s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.7727;1" dur="4.4s" repeatCount="indefinite"/><use href="#part2"/></g></g></g>
</svg>
