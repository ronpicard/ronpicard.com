<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Minimax search to depth 3</title>
<desc id="d">A search tree of depth 3 with two moves per position. The eight leaf positions are scored by evaluateBoard() with the example values 3, -1, 4, 9, 0, 2, -3, 5. Maximizing levels take the larger child and the minimizing level takes the smaller, giving 3, 9, 2, 5 then 3 and 2, so the root value is 3 and the move leading to the left branch is chosen. The values are an example, not a real game.</desc>
