="600">3</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/><use href="#part10"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0889;0.1556;1" dur="4.5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1704;0.2370;1" dur="4.5s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2519;0.3185;1" dur="4.5s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.4000;1" dur="4.5s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0889;0.1778;1" dur="4.5s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4444;0.6000;1" dur="4.5s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6222;0.7778;1" dur="4.5s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe5"><rect x="420" y="130" width="0" height="50"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.1778;0.3333;1" dur="4.5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part7"/></g><clipPath id="wipe6"><rect x="530" y="130" width="0" height="50"><animate attributeName="width" values="0;0;110;110" keyTimes="0;0.3556;0.5111;1" dur="4.5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe6)"><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3556;0.5111;1" dur="4.5s" repeatCount="indefinite"/><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6222;0.7778;1" dur="4.5s" repeatCount="indefinite"/><use href="#part10"/></g></g></g>
