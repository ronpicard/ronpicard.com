<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Quantifiers over a small domain</title>
<desc id="d">Left: the predicate Even(x) over the domain 1 to 4 is false, true, false, true, so there exists an x with Even(x) (witness 2) but not for all x (counterexample 1). Right: over {1, 2, 3}, every x has a larger y except 3, so for all x there exists y with x less than y is false.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><text x="64" y="212" fill="#ff2bd6" font-size="18" text-anchor="middle" font-weight="700">F</text></g><g id="part1"><text x="140" y="212" fill="#00ffc8" font-size="18" text-anchor="middle" font-weight="700">T</text></g><g id="part2"><text x="216" y="212" fill="#ff2bd6" font-size="18" text-anchor="middle" font-weight="700">F</text></g><g id="part3"><text x="292" y="212" fill="#00ffc8" font-size="18" text-anchor="middle" font-weight="700">T</text></g><g id="part4"><text x="28" y="252" fill="rgba(210,230,225,0.4)" font-size="12.5" text-anchor="start">Even(x): F, T, F, T</text></g><g id="part5"><circle cx="140" cy="160" r="25" fill="none" stroke="#00ffc8" stroke-width="3"/><text x="28" y="286" fill="#00ffc8" font-size="16" text-anchor="start" font-weight="700">∃x Even(x) is true</text><text x="28" y="308" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">witness: x = 2</text></g><g id="part6"><circle cx="64" cy="160" r="25" fill="none" stroke="#ff2bd6" stroke-width="3"/><text x="28" y="342" fill="#ff2bd6" font-size="16" text-anchor="start" font-weight="700">∀x Even(x) is false</text><text x="28" y="364" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">counterexample: x = 1</text></g><g id="part7"><line x1="442" y1="160" x2="504" y2="160" stroke="#00ffc8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="475" y="148" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">1 &lt; 2</text></g><g id="part8"><line x1="552" y1="160" x2="614" y2="160" stroke="#00ffc8" stroke-width="2.2" marker-end="url(#arrow)"/><text x="585" y="148" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">2 &lt; 3</text></g><g id="part9"><text x="380" y="252" fill="rgba(210,230,225,0.4)" font-size="12.5" text-anchor="start">x = 1 needs y = 2; x = 2 needs y = 3</text></g><g id="part10"><circle cx="640" cy="160" r="25" fill="none" stroke="#ff2bd6" stroke-width="3"/><text x="640" y="210" fill="#ff2bd6" font-size="12.5" text-anchor="middle">no larger y</text><text x="380" y="342" fill="#ff2bd6" font-size="16" text-anchor="start" font-weight="700">∀x ∃y (x &lt; y) is false</text><text x="380" y="364" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">fails at x = 3</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="400" fill="#05090c"/>
