<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Processor usage under four cooling setups</title>
<desc id="d">Range bars of processor usage between frames. No delay and no fan stays above 90 percent and crashes. A heatsink and fan alone give 80 to 90 percent. A 0.5 second delay alone drops from 80 to about 60 percent. The final system, with delay, heatsink and fan, drops from about 80 to about 40 percent.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="635" y="84.3" width="45" height="30" rx="6" fill="#ff5c5c" fill-opacity="0.85"/></g><g id="part1"><text x="625" y="103.8" fill="#e4f2f0" font-size="12" text-anchor="end">above 90%: overheats, crashes</text></g><g id="part2"><rect x="590" y="142.8" width="45" height="30" rx="6" fill="#ffb547" fill-opacity="0.85"/></g><g id="part3"><text x="580" y="162.3" fill="#e4f2f0" font-size="12" text-anchor="end">80% to 90%</text></g><g id="part4"><rect x="500" y="201.3" width="90" height="30" rx="6" fill="#00d4ff" fill-opacity="0.85"/></g><g id="part5"><text x="490" y="220.8" fill="#e4f2f0" font-size="12" text-anchor="end">80% down to about 60%</text></g><g id="part6"><rect x="410" y="259.8" width="180" height="30" rx="6" fill="#00ffc8" fill-opacity="0.85"/></g><g id="part7"><text x="400" y="279.3" fill="#e4f2f0" font-size="12" text-anchor="end">80% down to about 40%</text></g></defs>
<rect width="720" height="360" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Processor usage under four cooling setups</text><line x1="230" y1="70" x2="230" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="230" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">0%</text><line x1="320" y1="70" x2="320" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="320" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">20%</text><line x1="410" y1="70" x2="410" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="410" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">40%</text><line x1="500" y1="70" x2="500" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="500" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">60%</text><line x1="590" y1="70" x2="590" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="590" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">80%</text><line x1="680" y1="70" x2="680" y2="304" stroke="rgba(0,255,200,0.10)"/><text x="680" y="324" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">100%</text><text x="455" y="346" fill="#e4f2f0" font-size="13" text-anchor="middle">processor usage (values as quoted in the paper)</text><text x="216" y="103.8" fill="#e4f2f0" font-size="13" text-anchor="end">No delay, no fan</text><text x="216" y="162.3" fill="#e4f2f0" font-size="13" text-anchor="end">Heatsink and fan only</text><text x="216" y="220.8" fill="#e4f2f0" font-size="13" text-anchor="end">0.5 s delay only</text><text x="216" y="279.3" fill="#e4f2f0" font-size="13" text-anchor="end">Delay, heatsink and fan</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/></g><g class="anim"><clipPath id="wipe7"><rect x="635" y="84.3" width="0" height="30"><animate attributeName="width" values="0;0;45;45" keyTimes="0;0.0652;0.2174;1" dur="4.6s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe7)"><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1957;0.2609;1" dur="4.6s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe8"><rect x="590" y="142.8" width="0" height="30"><animate attributeName="width" values="0;0;45;45" keyTimes="0;0.2391;0.3913;1" dur="4.6s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe8)"><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3696;0.4348;1" dur="4.6s" repeatCount="indefinite"/><use href="#part3"/></g><clipPath id="wipe9"><rect x="500" y="201.3" width="0" height="30"><animate attributeName="width" values="0;0;90;90" keyTimes="0;0.413;0.5652;1" dur="4.6s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe9)"><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5435;0.6087;1" dur="4.6s" repeatCount="indefinite"/><use href="#part5"/></g><clipPath id="wipe10"><rect x="410" y="259.8" width="0" height="30"><animate attributeName="width" values="0;0;180;180" keyTimes="0;0.587;0.7391;1" dur="4.6s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe10)"><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7174;0.7826;1" dur="4.6s" repeatCount="indefinite"/><use href="#part7"/></g></g></g>
</svg>
