<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">NP, coNP and where P sits</title>
<desc id="d">A dashed ellipse labelled NP-Hard contains two overlapping ellipses, NP on the left and coNP on the right. Their overlap is NP intersect coNP, and P is a small circle inside that overlap. The leftmost slice of NP is NP-Complete and the rightmost slice of coNP is coNP-Complete.</desc>
