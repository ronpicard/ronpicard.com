<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Iterations until a solution is found with about 99% probability</title>
<desc id="d">Horizontal bars of iterations needed for about 99% probability of a solution. With 4 queens: random column move 400, random column swap 50, simulated annealing swap 45. With 5 queens: 450, 49 and 45.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
