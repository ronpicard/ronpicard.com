<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The collision avoidance controller as a state machine</title>
<desc id="d">State machine for the orientation-0 controller. Traveling0 moves x by 1 per step. A message from an aircraft heading toward it leads to Turn90 or Turn270, each waiting 1000 m, then to AvoidCollisionTraveling90 or 270, which move y by 1 per step until there is no message or no threat. A return turn of 1000 m restores orientation 0 and Traveling0. Reaching the destination leads to Final DestinationReached, a danger-zone message leads to Final ErrorDangerZoneBreached.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="28" y="150" width="130" height="72" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="93" y="182.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Traveling0</text><text x="93" y="201.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">x + 1 per step</text></g><g id="part1"><line x1="158" y1="174" x2="216" y2="120" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="158" y1="198" x2="216" y2="262" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="98" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">message from an aircraft</text><text x="28" y="112" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">heading toward this one</text></g><g id="part2"><rect x="216" y="84" width="130" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="281" y="108.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Turn90</text><text x="281" y="127.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">wait 1000 m</text><rect x="216" y="238" width="130" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="281" y="262.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Turn270</text><text x="281" y="281.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">wait 1000 m</text></g><g id="part3"><line x1="346" y1="112" x2="406" y2="112" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="346" y1="266" x2="406" y2="266" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part4"><rect x="406" y="84" width="140" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="476" y="100.4" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">AvoidCollision</text><text x="476" y="116" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Traveling90</text><text x="476" y="127.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">y + 1 per step</text><rect x="406" y="238" width="140" height="56" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="476" y="254.4" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">AvoidCollision</text><text x="476" y="270" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Traveling270</text><text x="476" y="281.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">y - 1 per step</text></g><g id="part5"><line x1="546" y1="112" x2="640" y2="150" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="546" y1="266" x2="640" y2="222" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600" y="98" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">no message, or no threat</text></g><g id="part6"><rect x="584" y="150" width="112" height="72" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="640" y="182.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Return turn</text><text x="640" y="201.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">wait 1000 m</text></g><g id="part7"><path d="M640 222L640 300L93 300L93 222" fill="none" stroke="#00ffc8" stroke-width="1.8" marker-end="url(#arrowT)"/><text x="366" y="316" fill="#00ffc8" font-size="11.5" text-anchor="middle">back to orientation 0, x + 1 per step</text></g><g id="part8"><line x1="93" y1="222" x2="93" y2="350" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 4"/><rect x="28" y="350" width="150" height="52" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="103" y="372.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Final</text><text x="103" y="391.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">DestinationReached</text></g><g id="part9"><line x1="330" y1="322" x2="330" y2="350" stroke="#ff2bd6" stroke-width="1.6" marker-end="url(#arrowM)" stroke-dasharray="4 4"/><rect x="236" y="350" width="190" height="52" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="331" y="372.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Final</text><text x="331" y="391.9" fill="#ff2bd6" font-size="11" text-anchor="middle">ErrorDangerZoneBreached</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="430" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Inside CollisionAvoidanceMonitor0 (flying at orientation 0)</text><rect x="14" y="52" width="692" height="270" rx="14" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="5 5"/><text x="28" y="74" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">Controller mode</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1346;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1538;0.2500;1" dur="5.2s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2308;0.3269;1" dur="5.2s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3269;0.3846;1" dur="5.2s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3846;0.4808;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5962;1" dur="5.2s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5385;0.6346;1" dur="5.2s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe4"><rect x="650" y="290" width="0" height="40"><animate attributeName="x" values="650;650;90;90" keyTimes="0;0.6346;0.7308;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;560;560" keyTimes="0;0.6346;0.7308;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7115;0.7885;1" dur="5.2s" repeatCount="indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part9"/></g></g><text x="446" y="372" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">Safety monitor: a message placing the</text><text x="446" y="387" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">other aircraft inside the danger zone</text><text x="446" y="402" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">sends the controller to this state.</text></g>
</svg>
