<title id="t">Simulated speed response, reference 0.2 m/s</title>
<desc id="d">Simulated speed against time for a 0.2 metre per second reference. Speed first dips below zero because of the friction step, rises steeply, overshoots slightly to about 0.29, and levels out at 0.2 after about 3 seconds. The curve is traced by eye from the paper’s scope plot.</desc>
