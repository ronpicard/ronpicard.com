<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Random column swap on four queens</title>
<desc id="d">Four 4 by 4 boards in a row. The queens start on the diagonal, columns 1 2 3 4, with all four attacked. Swapping Q1 and Q2, then Q2 and Q4, then Q3 and Q4 reaches columns 2 4 1 3, where no queen is attacked. The run is illustrative.</desc>
