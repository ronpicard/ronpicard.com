<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Training time on 50,000 images</title>
<desc id="d">Horizontal bars of training time. Batch 500 without momentum: 2,118 s for 99.15% test accuracy. Batch 27 without momentum: 745 s for 99.18%. Batch 27 with momentum 0.1: 262 s for 99.16%. Batch 27 with momentum 0.9: 230 s for 99.22%, the fastest and most accurate.</desc>
