<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Chess engine architecture</title>
<desc id="d">Four layers of the C++ engine. main.cpp reads the search depth from config.txt and runs the game loop. It asks AIPlayer for the best move. AIPlayer uses Move to list legal moves and Board to read the squares. Move holds the rules: valid moves, check, checkmate, stalemate and repetition. Board is an 8 by 8 grid of squares.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="60" y="56" width="600" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff" stroke-opacity="0.7"/><text x="80" y="84" fill="#00d4ff" font-size="16" text-anchor="start" font-weight="700">main.cpp</text><text x="80" y="104" fill="#e4f2f0" font-size="13" text-anchor="start">reads depth=3 from config.txt, then loops:</text><text x="80" y="121" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">check game end, ask AIPlayer for a move, play it</text></g><g id="part1"><line x1="120" y1="132" x2="120" y2="162" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part2"><text x="136" y="151" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">uses</text></g><g id="part3"><rect x="60" y="164" width="600" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6" stroke-opacity="0.7"/><text x="80" y="192" fill="#ff2bd6" font-size="16" text-anchor="start" font-weight="700">AIPlayer</text><text x="80" y="212" fill="#e4f2f0" font-size="13" text-anchor="start">getBestMove()  ·  minimax(depth)  ·  evaluateBoard()</text><text x="80" y="229" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">adds up piece values, searches to the set depth</text></g><g id="part4"><line x1="120" y1="240" x2="120" y2="270" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part5"><text x="136" y="259" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">asks for legal moves</text></g><g id="part6"><rect x="60" y="272" width="600" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ffb547" stroke-opacity="0.7"/><text x="80" y="300" fill="#ffb547" font-size="16" text-anchor="start" font-weight="700">Move</text><text x="80" y="320" fill="#e4f2f0" font-size="13" text-anchor="start">getAllValidMoves()  ·  makeMove()  ·  isKingInCheck()</text><text x="80" y="337" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">isCheckmate()  ·  isStalemate()  ·  threefold repetition</text></g><g id="part7"><line x1="120" y1="348" x2="120" y2="378" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part8"><text x="136" y="367" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">reads and writes squares</text></g><g id="part9"><rect x="60" y="380" width="600" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8" stroke-opacity="0.7"/><text x="80" y="405" fill="#00ffc8" font-size="16" text-anchor="start" font-weight="700">Board</text><text x="160" y="405" fill="#e4f2f0" font-size="13" text-anchor="start">8 by 8 grid of squares, each a piece and a color; printBoard()</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="430" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">How the engine is put together</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0706;0.1647;1" dur="4.25s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="110" y="130" width="20" height="0"><animate attributeName="height" values="0;0;34;34" keyTimes="0;0.1647;0.2353;1" dur="4.25s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2118;0.2824;1" dur="4.25s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2706;0.3647;1" dur="4.25s" repeatCount="indefinite"/><use href="#part3"/></g><clipPath id="wipe2"><rect x="110" y="238" width="20" height="0"><animate attributeName="height" values="0;0;34;34" keyTimes="0;0.3647;0.4353;1" dur="4.25s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4118;0.4824;1" dur="4.25s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4706;0.5647;1" dur="4.25s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe3"><rect x="110" y="346" width="20" height="0"><animate attributeName="height" values="0;0;34;34" keyTimes="0;0.5647;0.6353;1" dur="4.25s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6118;0.6824;1" dur="4.25s" repeatCount="indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6706;0.7647;1" dur="4.25s" repeatCount="indefinite"/><use href="#part9"/></g></g></g>
