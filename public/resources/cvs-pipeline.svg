<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">From camera frame to emailed clip</title>
<desc id="d">Two rows of boxes. In the idle state, one frame per second is pulled, rotated and resized, passed through the Caffe network, and filtered by confidence. When a human is found, the run state collects frames every 0.05 seconds, processes each in about 1.5 seconds, writes an AVI and emails it to the owner.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="20" y="80" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="90" y="113.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Pull frame</text><text x="90" y="125.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">rotate, resize</text><text x="90" y="141" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">to a square</text></g><g id="part1"><line x1="164" y1="117" x2="196" y2="117" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part2"><rect x="200" y="80" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="270" y="113.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Caffe DNN</text><text x="270" y="125.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">frame to blob,</text><text x="270" y="141" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">find detections</text></g><g id="part3"><line x1="344" y1="117" x2="376" y2="117" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part4"><rect x="380" y="80" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="450" y="113.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Filter</text><text x="450" y="125.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">drop detections</text><text x="450" y="141" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">below threshold</text></g><g id="part5"><line x1="524" y1="117" x2="556" y2="117" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="560" y="80" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="630" y="113.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Human found?</text><text x="630" y="133.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">no: stay idle</text></g><g id="part7"><path d="M630 158V206H90V254" fill="none" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/><text x="360" y="200" fill="#00ffc8" font-size="12" text-anchor="middle">yes</text></g><g id="part8"><rect x="20" y="260" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="90" y="293.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Collect frames</text><text x="90" y="305.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">every 0.05 s for</text><text x="90" y="321" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">the clip time</text></g><g id="part9"><line x1="164" y1="297" x2="196" y2="297" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part10"><rect x="200" y="260" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="270" y="293.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Process frames</text><text x="270" y="305.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">about 1.5 s each,</text><text x="270" y="321" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">boxes drawn</text></g><g id="part11"><line x1="344" y1="297" x2="376" y2="297" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part12"><rect x="380" y="260" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="450" y="293.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Write AVI</text><text x="450" y="313.2" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">cv2 video writer</text></g><g id="part13"><line x1="524" y1="297" x2="556" y2="297" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part14"><rect x="560" y="260" width="140" height="74" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="630" y="293.9" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Email owner</text><text x="630" y="305.4" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">SMTP, local-time</text><text x="630" y="321" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">stamp, clip attached</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="400" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">From camera frame to emailed clip</text><text x="20" y="62" fill="#00ffc8" font-size="12" text-anchor="start" letter-spacing="2">IDLE STATE: one frame per second</text><text x="20" y="242" fill="#ff2bd6" font-size="12" text-anchor="start" letter-spacing="2">RUN STATE: once a human is detected</text><text x="360" y="378" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">A 20 second clip is 400 frames; at about 1.5 s each, processing takes roughly 10 minutes.</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/><use href="#part10"/><use href="#part11"/><use href="#part12"/><use href="#part13"/><use href="#part14"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0743;0.1238;1" dur="4.04s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="160" y="80" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.1287;0.1782;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1535;0.2030;1" dur="4.04s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe2"><rect x="340" y="80" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.2079;0.2574;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2327;0.2822;1" dur="4.04s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe3"><rect x="520" y="80" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.2871;0.3366;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3119;0.3614;1" dur="4.04s" repeatCount="indefinite"/><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3663;0.4653;1" dur="4.04s" repeatCount="indefinite"/><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4653;0.5149;1" dur="4.04s" repeatCount="indefinite"/><use href="#part8"/></g><clipPath id="wipe4"><rect x="160" y="260" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.5198;0.5693;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5446;0.5941;1" dur="4.04s" repeatCount="indefinite"/><use href="#part10"/></g><clipPath id="wipe5"><rect x="340" y="260" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.599;0.6485;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part11"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6238;0.6733;1" dur="4.04s" repeatCount="indefinite"/><use href="#part12"/></g><clipPath id="wipe6"><rect x="520" y="260" width="0" height="74"><animate attributeName="width" values="0;0;40;40" keyTimes="0;0.6782;0.7277;1" dur="4.04s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe6)"><use href="#part13"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.703;0.7525;1" dur="4.04s" repeatCount="indefinite"/><use href="#part14"/></g></g></g>
</svg>
