<title id="t">Set operators on S and T as Venn diagrams</title>
<desc id="d">Four Venn diagrams of S = {a, b, c, d} and T = {a, b, e, f}. Intersection is {a, b}; union is {a, b, c, d, e, f}; difference S minus T is {c, d}; symmetric difference is {c, d, e, f}. Each shaded region appears in turn.</desc>
