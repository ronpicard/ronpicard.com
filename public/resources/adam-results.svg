<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Adam test accuracy by β setting</title>
<desc id="d">Horizontal bars of test accuracy for three Adam settings with batch 50 and learning rate 0.01. β₁ 0.9 and β₂ 0.9: 98.36%. β₁ 0.5 and β₂ 0.9: 98.94%, the best. β₁ 0.9 and β₂ 0.5: 90.39%, exactly what a model that always answers &quot;not a 9&quot; would score.</desc>
<defs></defs>
<rect width="720" height="320" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">Adam test accuracy on 10,000 digits, by β setting</text><line x1="240" y1="50" x2="240" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="240" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">85%</text><line x1="376.7" y1="50" x2="376.7" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="376.7" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">90%</text><line x1="513.3" y1="50" x2="513.3" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="513.3" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">95%</text><line x1="650" y1="50" x2="650" y2="286" stroke="rgba(0,255,200,0.10)"/><text x="650" y="306" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="middle">100%</text><text x="228" y="89.3" fill="#e4f2f0" font-size="13" text-anchor="end">β₁ = 0.9, β₂ = 0.9</text><rect x="240" y="71.8" width="365.2" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="613.2" y="89.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">98.36%</text><text x="228" y="146.8" fill="#e4f2f0" font-size="13" text-anchor="end">β₁ = 0.5, β₂ = 0.9</text><rect x="240" y="129.3" width="381" height="26" rx="4" fill="#00ffc8" fill-opacity="0.95"/><text x="629" y="146.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">98.94%</text><text x="228" y="204.3" fill="#e4f2f0" font-size="13" text-anchor="end">β₁ = 0.9, β₂ = 0.5</text><rect x="240" y="186.8" width="147.3" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="395.3" y="204.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">90.39%</text><text x="228" y="261.8" fill="#e4f2f0" font-size="13" text-anchor="end">always answer “not a 9”</text><rect x="240" y="244.3" width="147.3" height="26" rx="4" fill="rgba(210,230,225,0.4)" fill-opacity="0.6"/><text x="395.3" y="261.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">90.39%</text><text x="696" y="30" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="end">axis starts at 85%</text>
