<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Adam test accuracy by β setting</title>
<desc id="d">Horizontal bars of test accuracy for three Adam settings with batch 50 and learning rate 0.01. β₁ 0.9 and β₂ 0.9: 98.36%. β₁ 0.5 and β₂ 0.9: 98.94%, the best. β₁ 0.9 and β₂ 0.5: 90.39%, exactly what a model that always answers &quot;not a 9&quot; would score.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="240" y="71.8" width="365.2" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="613.2" y="89.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">98.36%</text></g><g id="part1"><rect x="240" y="129.3" width="381" height="26" rx="4" fill="#00ffc8" fill-opacity="0.95"/><text x="629" y="146.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">98.94%</text></g><g id="part2"><rect x="240" y="186.8" width="147.3" height="26" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="395.3" y="204.3" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">90.39%</text></g><g id="part3"><rect x="240" y="244.3" width="147.3" height="26" rx="4" fill="rgba(210,230,225,0.4)" fill-opacity="0.6"/><text x="395.3" y="261.8" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">90.39%</text></g></defs>
<rect width="720" height="320" fill="#05090c"/>
