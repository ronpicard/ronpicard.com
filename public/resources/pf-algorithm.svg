<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">One pass of the particle filter</title>
<desc id="d">Four steps in a row: initialize N particles uniformly, use each particle to set the control law and predict the speed, keep the best K by weight, and resample the rest from Gaussians around the kept particles. An arrow returns from resampling to the use step.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="26" y="70" width="140" height="64" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="96" y="107.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">1  Initialize</text><text x="96" y="171.5" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">N particles, uniform:</text><text x="96" y="185.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">m 453.592 to 2267.962 kg</text><text x="96" y="200.1" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">b 1 to 150 N·s/m</text></g><g id="part1"><line x1="168" y1="102" x2="200" y2="102" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part2"><rect x="202" y="70" width="140" height="64" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="272" y="107.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">2  Use</text><text x="272" y="164.4" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">sample (m, b), apply the</text><text x="272" y="178.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">control law, predict the</text><text x="272" y="193" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">speed, weight = |predicted</text><text x="272" y="207.3" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">− measured|</text></g><g id="part3"><line x1="344" y1="102" x2="376" y2="102" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part4"><rect x="378" y="70" width="140" height="64" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="448" y="107.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">3  Keep</text><text x="448" y="171.5" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">sort by weight, keep the</text><text x="448" y="185.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">best K (the keep</text><text x="448" y="200.1" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">percentage of N)</text></g><g id="part5"><line x1="520" y1="102" x2="552" y2="102" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arr)"/></g><g id="part6"><rect x="554" y="70" width="140" height="64" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="624" y="107.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">4  Resample</text><text x="624" y="171.5" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">draw N − K new particles</text><text x="624" y="185.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">from Gaussians (kernel</text><text x="624" y="200.1" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">sigma) around the kept ones</text></g><g id="part7"><path d="M624 234V260H272V236" fill="none" stroke="#ff2bd6" stroke-width="1.8" marker-end="url(#arrM)"/></g><g id="part8"><text x="448" y="282" fill="#ff2bd6" font-size="12" text-anchor="middle">repeat steps 2 to 4; each pass is one resampling step</text></g><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker></defs>
<rect width="720" height="350" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">One pass of the particle filter</text><text x="24" y="334" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start">Tuning knobs: number of particles, keep percentage, kernel sigmas, initial bounds, saturation limits and pole location (−1.5).</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0588;0.1373;1" dur="5.1s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe3"><rect x="166" y="70" width="0" height="64"><animate attributeName="width" values="0;0;36;36" keyTimes="0;0.1176;0.1765;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1961;0.2745;1" dur="5.1s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe4"><rect x="342" y="70" width="0" height="64"><animate attributeName="width" values="0;0;36;36" keyTimes="0;0.2549;0.3137;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.4118;1" dur="5.1s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe5"><rect x="518" y="70" width="0" height="64"><animate attributeName="width" values="0;0;36;36" keyTimes="0;0.3922;0.4510;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe5)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4706;0.5490;1" dur="5.1s" repeatCount="indefinite"/><use href="#part6"/></g><clipPath id="wipe6"><rect x="628" y="232" width="0" height="34"><animate attributeName="x" values="628;628;268;268" keyTimes="0;0.6078;0.7843;1" dur="5.1s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;360;360" keyTimes="0;0.6078;0.7843;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe6)"><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7255;0.8039;1" dur="5.1s" repeatCount="indefinite"/><use href="#part8"/></g></g></g>
</svg>
