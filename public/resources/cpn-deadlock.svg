<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The two-process deadlock example</title>
<desc id="d">A colored Petri net with places A, B, Resource and Deadlock and transitions LockA, LockB, ReleaseA, ReleaseB and one leading to Deadlock. A holds a blue token and B a red token. Both lock transitions feed Resource, and the transition into Deadlock needs one red and one blue token, so it is enabled only when both processes hold the resource request at once.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><circle cx="70" cy="90" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="70" cy="330" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="400" cy="210" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><circle cx="640" cy="210" r="32" fill="rgba(0,255,200,0.035)" stroke="#e4f2f0" stroke-width="2"/><text x="70" y="142" fill="#e4f2f0" font-size="14" text-anchor="middle">A</text><text x="70" y="382" fill="#e4f2f0" font-size="14" text-anchor="middle">B</text><text x="400" y="262" fill="#e4f2f0" font-size="14" text-anchor="middle">Resource</text><text x="640" y="262" fill="#e4f2f0" font-size="14" text-anchor="middle">Deadlock</text></g><g id="part1"><rect x="230" y="68" width="10" height="44" rx="2" fill="#e4f2f0"/><text x="235" y="128" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">LockA</text><rect x="230" y="308" width="10" height="44" rx="2" fill="#e4f2f0"/><text x="235" y="368" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">LockB</text><rect x="230" y="148" width="10" height="44" rx="2" fill="#e4f2f0"/><text x="235" y="208" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">ReleaseA</text><rect x="230" y="228" width="10" height="44" rx="2" fill="#e4f2f0"/><text x="235" y="288" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">ReleaseB</text><rect x="515" y="188" width="10" height="44" rx="2" fill="#e4f2f0"/><text x="520" y="248" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">Transition</text></g><g id="part2"><line x1="102" y1="90" x2="226" y2="90" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="239.9" y1="93.5" x2="371.7" y2="189.4" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="102" y1="330" x2="226" y2="330" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="239.9" y1="326.5" x2="371.7" y2="230.6" stroke="#ff5c5c" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="368.9" y1="202.5" x2="243.7" y2="172.1" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="229.6" y1="167.4" x2="101.5" y2="105.3" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="368.9" y1="217.5" x2="243.7" y2="247.9" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="229.6" y1="252.6" x2="101.5" y2="314.7" stroke="#ff5c5c" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="432" y1="210" x2="511" y2="210" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="526" y1="210" x2="605" y2="210" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part3"><text x="320" y="112" fill="#00d4ff" font-size="12" text-anchor="start">blue:1</text><text x="320" y="316" fill="#ff5c5c" font-size="12" text-anchor="start">red:1</text><text x="98" y="140" fill="#00d4ff" font-size="12" text-anchor="start">blue:1</text><text x="98" y="290" fill="#ff5c5c" font-size="12" text-anchor="start">red:1</text><text x="572" y="198" fill="#00ffc8" font-size="12" text-anchor="start">green:1</text></g><g id="part4"><circle cx="70" cy="90" r="8" fill="#00d4ff"/><circle cx="70" cy="330" r="8" fill="#ff5c5c"/><text x="696" y="70" fill="#e4f2f0" font-size="12" text-anchor="end">start: one blue token in A, one red token in B</text></g><g id="part5"><rect x="482" y="148" width="76" height="30" rx="6" fill="none" stroke="#ffb547"/><text x="520" y="168" fill="#ffb547" font-size="12" text-anchor="middle">1 red + 1 blue</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="420" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The two-process example: shared resource and deadlock</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1923;0.2885;1" dur="5.2s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe2"><rect x="0" y="40" width="0" height="360"><animate attributeName="width" values="0;0;720;720" keyTimes="0;0.3077;0.5000;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5769;1" dur="5.2s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5962;0.6923;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7115;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part5"/></g></g></g>
