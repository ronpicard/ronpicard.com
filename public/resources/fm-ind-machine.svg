<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The extended-state machine</title>
<desc id="d">Two states S1 and S2 with four transitions. When x is below 9 the machine moves to or stays in S2 and adds one to x; when x is at least 9 it moves to or stays in S1 and resets x to 0. It starts in S1 with x equal to 0.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><circle cx="210" cy="180" r="46" fill="rgba(0,255,200,0.035)" stroke="#00d4ff" stroke-width="1.8"/><text x="210" y="187" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">S1</text><circle cx="510" cy="180" r="46" fill="rgba(0,255,200,0.035)" stroke="#00d4ff" stroke-width="1.8"/><text x="510" y="187" fill="#e4f2f0" font-size="20" text-anchor="middle" font-weight="600">S2</text></g><g id="part1"><line x1="210" y1="76" x2="210" y2="131" stroke="#00ffc8" stroke-width="2" marker-end="url(#arrowT)"/><text x="222" y="92" fill="#e4f2f0" font-size="13.5" text-anchor="start">start: x = 0</text></g><g id="part2"><path d="M244 146Q360 96 476 146" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360" y="106" fill="#e4f2f0" font-size="13.5" text-anchor="middle">x &lt; 9: x′ = x + 1</text></g><g id="part3"><path d="M476 214Q360 264 244 214" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360" y="270" fill="#e4f2f0" font-size="13.5" text-anchor="middle">x ≥ 9: x′ = 0</text></g><g id="part4"><path d="M540 144C610 90 610 270 540 216" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="1.8" marker-end="url(#arrow)"/><text x="620" y="174" fill="#e4f2f0" font-size="13.5" text-anchor="start">x &lt; 9:</text><text x="620" y="194" fill="#e4f2f0" font-size="13.5" text-anchor="start">x′ = x + 1</text></g><g id="part5"><path d="M180 216C110 270 110 90 180 144" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="1.8" marker-end="url(#arrow)"/><text x="100" y="174" fill="#e4f2f0" font-size="13.5" text-anchor="end">x ≥ 9:</text><text x="100" y="194" fill="#e4f2f0" font-size="13.5" text-anchor="end">x′ = 0</text></g><g id="part6"><text x="24" y="316" fill="#e4f2f0" font-size="13.5" text-anchor="start">Starting at S1 with x = 0, x runs 0, 1, …, 9 and then resets to 0, so x ≤ 9 always.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The extended-state machine: states S1 and S2, variable x</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0577;0.1731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1731;0.2692;1" dur="5.2s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe7"><rect x="210" y="70" width="0" height="100"><animate attributeName="width" values="0;0;300;300" keyTimes="0;0.2692;0.4231;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe7)"><use href="#part2"/></g><clipPath id="wipe8"><rect x="510" y="190" width="0" height="100"><animate attributeName="x" values="510;510;210;210" keyTimes="0;0.4231;0.5769;1" dur="5.2s" repeatCount="indefinite"/><animate attributeName="width" values="0;0;300;300" keyTimes="0;0.4231;0.5769;1" dur="5.2s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe8)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5769;0.6731;1" dur="5.2s" repeatCount="indefinite"/><use href="#part4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6731;0.7692;1" dur="5.2s" repeatCount="indefinite"/><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7308;0.8077;1" dur="5.2s" repeatCount="indefinite"/><use href="#part6"/></g></g></g>
</svg>
