<title id="t">Unreduced binary decision diagram</title>
<desc id="d">A complete binary decision tree over A, B and C with eight leaves. Edges are labelled 0 and 1. Seven leaves are 0; only the leaf for A=0, B=1, C=1 is 1, the satisfying assignment of not-A and B and C.</desc>
