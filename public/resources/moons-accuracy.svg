%</text><text x="238" y="248" fill="#e4f2f0" font-size="13" text-anchor="end">dropout, keep 0.85</text><rect x="250" y="230.6" width="283.3" height="25.8" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="541.3" y="248" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">88.5%</text><text x="238" y="289.7" fill="#e4f2f0" font-size="13" text-anchor="end">dropout, keep 0.95</text><rect x="250" y="272.2" width="300" height="25.8" rx="4" fill="#00d4ff" fill-opacity="0.6"/><text x="558" y="289.7" fill="#e4f2f0" font-size="13" text-anchor="start" font-weight="600">89.0%</text><text x="696" y="30" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="end">axis starts at 80% · 1 point = 2 of 200 test points</text>
