<title id="t">Test accuracy on 200 new points</title>
<desc id="d">Horizontal bars of test accuracy. A straight-line logistic regression scores 84%. The network scores 88.5% without regularisation, 89.0% with L2 λ 0.85, 89.5% with L2 λ 0.10, 88.5% with dropout keep 0.85, and 89.0% with dropout keep 0.95.</desc>
