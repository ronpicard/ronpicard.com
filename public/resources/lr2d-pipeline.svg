<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">What the notebook does</title>
<desc id="d">Flow diagram: load population and profit for each city, normalise both columns, initialise θ to (1, 1) with learning rate 0.1, then repeat 100 times: compute the cost, compute the gradient, and update θ. Finally undo the normalisation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="300" fill="#05090c"/>
<text x="24" y="32" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">What the notebook does</text><rect x="24" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="94" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Load data</text><text x="94" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">one row per city:</text><text x="94" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">population, profit</text><line x1="166" y1="108" x2="192" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="194" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="264" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Normalise</text><text x="264" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">x ← (x − μ) / σ</text><text x="264" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">for both columns</text><line x1="336" y1="108" x2="362" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="364" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="434" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Initialise</text><text x="434" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">θ = (1, 1)</text><text x="434" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">α = 0.1</text><line x1="506" y1="108" x2="530" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="534" y="52" width="174" height="200" rx="12" fill="rgba(255,43,214,0.06)" stroke="rgba(255,43,214,0.45)"/><text x="621" y="74" fill="#ff2bd6" font-size="13" text-anchor="middle" font-weight="600">repeat 100×</text><rect x="548" y="88" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="112.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">1. cost J(θ)</text><rect x="548" y="140" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="164.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">2. gradient ∇J</text><rect x="548" y="192" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="216.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">3. θ ← θ − α∇J</text><text x="24" y="200" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">Then the line is mapped back to</text><text x="24" y="220" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">real population and profit units</text><text x="24" y="240" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">by undoing the normalisation.</text>
</svg>
