<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">What the notebook does</title>
<desc id="d">Flow diagram: load population and profit for each city, normalise both columns, initialise θ to (1, 1) with learning rate 0.1, then repeat 100 times: compute the cost, compute the gradient, and update θ. Finally undo the normalisation.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="94" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Load data</text><text x="94" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">one row per city:</text><text x="94" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">population, profit</text></g><g id="part1"><line x1="166" y1="108" x2="192" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part2"><rect x="194" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="264" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Normalise</text><text x="264" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">x ← (x − μ) / σ</text><text x="264" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">for both columns</text></g><g id="part3"><line x1="336" y1="108" x2="362" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part4"><rect x="364" y="70" width="140" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="434" y="104.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Initialise</text><text x="434" y="116.7" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">θ = (1, 1)</text><text x="434" y="131" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">α = 0.1</text></g><g id="part5"><line x1="506" y1="108" x2="530" y2="108" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part6"><rect x="534" y="52" width="174" height="200" rx="12" fill="rgba(255,43,214,0.06)" stroke="rgba(255,43,214,0.45)"/><text x="621" y="74" fill="#ff2bd6" font-size="13" text-anchor="middle" font-weight="600">repeat 100×</text></g><g id="part7"><rect x="548" y="88" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="112.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">1. cost J(θ)</text></g><g id="part8"><rect x="548" y="140" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="164.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">2. gradient ∇J</text></g><g id="part9"><rect x="548" y="192" width="146" height="40" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="621" y="216.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">3. θ ← θ − α∇J</text></g><g id="part10"><text x="24" y="200" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">Then the line is mapped back to</text><text x="24" y="220" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">real population and profit units</text><text x="24" y="240" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="start">by undoing the normalisation.</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="300" fill="#05090c"/>
<g id="play"><text x="24" y="32" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">What the notebook does</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/><use href="#part5"/><use href="#part6"/><use href="#part7"/><use href="#part8"/><use href="#part9"/><use href="#part10"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0588;0.1078;1" dur="5.1s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe2"><rect x="164" y="96" width="0" height="24"><animate attributeName="width" values="0;0;30;30" keyTimes="0;0.1176;0.1667;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1765;0.2255;1" dur="5.1s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe3"><rect x="334" y="96" width="0" height="24"><animate attributeName="width" values="0;0;30;30" keyTimes="0;0.2353;0.2843;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2941;0.3431;1" dur="5.1s" repeatCount="indefinite"/><use href="#part4"/></g><clipPath id="wipe4"><rect x="504" y="96" width="0" height="24"><animate attributeName="width" values="0;0;28;28" keyTimes="0;0.3529;0.4020;1" dur="5.1s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe4)"><use href="#part5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4118;0.4902;1" dur="5.1s" repeatCount="indefinite"/><use href="#part6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4902;0.5490;1" dur="5.1s" repeatCount="indefinite"/><use href="#part7"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5588;0.6176;1" dur="5.1s" repeatCount="indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6275;0.6863;1" dur="5.1s" repeatCount="indefinite"/><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7255;0.8039;1" dur="5.1s" repeatCount="indefinite"/><use href="#part10"/></g></g></g>
</svg>
