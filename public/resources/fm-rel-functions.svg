<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Relations and functions as arrows</title>
<desc id="d">Four mappings from the domain {1, 2, 3, 4} to the codomain {1, 2, 3, 4}. A relation where 1 maps to both 1 and 2 is not a function. A partial function leaves 4 unmapped. A total function maps 1 to 1, 2 to 3, 3 to 4 and 4 to 3. A bijection maps each element to itself.</desc>
