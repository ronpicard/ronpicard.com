<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Bounded model checking, K = 2: the bound is too short</title>
<desc id="d">The search tree explored depth first but cut off after two edges, so the search reaches every C node but never assigns C and never reaches a leaf. The ring visits A, B, C and backtracks through both halves of the tree and finishes without finding a satisfying leaf.</desc>
