indefinite"/><use href="#part8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6648;0.7168;1" dur="5.08s" repeatCount="indefinite"/><use href="#part9"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7168;0.7687;1" dur="5.08s" repeatCount="indefinite"/><use href="#part10"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7514;0.8033;1" dur="5.08s" repeatCount="indefinite"/><use href="#part11"/></g></g></g>
