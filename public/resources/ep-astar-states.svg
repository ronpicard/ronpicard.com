<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Node detection and turning logic</title>
<desc id="d">State diagram. Line following leads to On a node when all three ground sensors see a line, then to Just past the node when they no longer do. With no turn needed it returns to line following. For a turn it pauses and steps off the node, locks into fixed turning wheel speeds while ignoring sensors, unlocks mid-turn, and returns to line following when a new line is detected.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="100" width="190" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="119" y="134.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Line following</text><text x="119" y="153.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">Braitenberg control</text></g><g id="part1"><line x1="214" y1="138" x2="266" y2="138" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="240" y="124" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">three sensors</text><text x="240" y="156" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">on a line</text></g><g id="part2"><rect x="266" y="100" width="190" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="361" y="134.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">On a node</text><text x="361" y="153.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">drive straight, flag set</text></g><g id="part3"><line x1="456" y1="138" x2="508" y2="138" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="482" y="124" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">not all three</text><text x="482" y="156" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="middle">on a line</text></g><g id="part4"><rect x="508" y="100" width="188" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="602" y="134.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Just past the node</text><text x="602" y="153.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">flag flipped</text></g><g id="part5"><path d="M602 100L602 68L119 68L119 100" fill="none" stroke="#00ffc8" stroke-width="1.8" marker-end="url(#arrowT)"/><text x="360" y="60" fill="#00ffc8" font-size="11.5" text-anchor="middle">no turn needed: resume line following</text></g><g id="part6"><line x1="602" y1="176" x2="602" y2="286" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="612" y="236" fill="rgba(210,230,225,0.72)" font-size="11.5" text-anchor="start">turn needed</text></g><g id="part7"><rect x="508" y="286" width="188" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="602" y="320.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Pause, then step off</text><text x="602" y="339.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">brief line following</text></g><g id="part8"><line x1="508" y1="324" x2="456" y2="324" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/></g><g id="part9"><rect x="266" y="286" width="190" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="361" y="320.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Turn lock</text><text x="361" y="339.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">fixed wheel speeds, sensors ignored</text></g><g id="part10"><line x1="266" y1="324" x2="214" y2="324" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="286" width="190" height="76" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="119" y="320.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Unlocked</text><text x="119" y="339.9" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">mid-turn, watching sensors</text></g><g id="part11"><path d="M119 286L119 176" fill="none" stroke="#00ffc8" stroke-width="1.8" marker-end="url(#arrowT)"/><text x="129" y="236" fill="#00ffc8" font-size="11.5" text-anchor="start">new line detected</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker></defs>
<rect width="720" height="420" fill="#05090c"/>
