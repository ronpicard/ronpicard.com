<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Piece values in the board evaluation</title>
<desc id="d">Horizontal bars of the value each piece adds to the score: pawn 1, knight 3, bishop 3, rook 5, queen 9, king 1000 (its bar is cut off at 10). White pieces add their value and black pieces subtract it.</desc>
