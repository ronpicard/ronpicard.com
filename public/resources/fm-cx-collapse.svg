<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">If P = NP, the classes collapse into one</title>
<desc id="d">Two diagrams. In the first, if P equals NP then P, NP and NP-Complete are one region inside the dashed NP-Hard region. In the second, with coNP included, P, NP, coNP, NP-Complete and coNP-Complete are all one region inside NP-Hard.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><ellipse cx="360" cy="124" rx="335" ry="76" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="2" stroke-dasharray="9 6"/><text x="360" y="72" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">NP-Hard</text><ellipse cx="360" cy="130" rx="190" ry="40" fill="#00ffc8" fill-opacity="0.12" stroke="#00ffc8" stroke-width="2"/><text x="360" y="136" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">P = NP = NP-Complete</text><text x="24" y="68" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">NP on its own</text></g><g id="part1"><ellipse cx="360" cy="262" rx="335" ry="76" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="2" stroke-dasharray="9 6"/><text x="360" y="210" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">NP-Hard</text><ellipse cx="360" cy="268" rx="280" ry="40" fill="#00ffc8" fill-opacity="0.12" stroke="#00ffc8" stroke-width="2"/><text x="360" y="274" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">P = NP = coNP = NP-Complete = coNP-Complete</text><text x="24" y="206" fill="rgba(210,230,225,0.72)" font-size="12.5" text-anchor="start">with coNP</text></g></defs>
<rect width="720" height="360" fill="#05090c"/>
<g id="play"><text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">If P = NP, the classes collapse into one</text><g class="still"><use href="#part0"/><use href="#part1"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0769;0.3590;1" dur="3.9s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4615;0.7436;1" dur="3.9s" repeatCount="indefinite"/><use href="#part1"/></g></g></g>
</svg>
