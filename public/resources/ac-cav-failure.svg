<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Why a 2000 m communication zone fails</title>
<desc id="d">Separation between the two aircraft in the head-on test falls by 2 m per step, from 4000 m to 0 at step 2000. With a 3000 m communication zone the message arrives at step 500 and the 1000-step turn takes effect at step 1500, with 1000 m left, outside the 500 m danger zone. With a 2000 m zone the message arrives at step 1000 and the turn takes effect at step 2000 with 0 m left, so the danger zone is breached near step 1750.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><path d="M70 84L542.3 274" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="3"/></g><g id="part1"><circle cx="188.1" cy="131.5" r="6" fill="#00ffc8"/><circle cx="424.2" cy="226.5" r="6" fill="#00ffc8"/><text x="200.1" y="127.5" fill="#e4f2f0" font-size="12" text-anchor="start">message at 3000 m</text><text x="412.2" y="244.5" fill="#e4f2f0" font-size="12" text-anchor="end">turn takes effect: 1000 m apart</text></g><g id="part2"><rect x="188.1" y="296" width="236.2" height="18" rx="4" fill="#00ffc8" fill-opacity="0.55"/><text x="196.1" y="309" fill="#e4f2f0" font-size="12" text-anchor="start">turning (1000 steps)</text><circle cx="188.1" cy="305" r="5" fill="#00ffc8"/><circle cx="424.2" cy="305" r="5" fill="#00ffc8"/><text x="436.2" y="309" fill="#e4f2f0" font-size="12" text-anchor="start">safe</text></g><g id="part3"><circle cx="306.2" cy="179" r="6" fill="#ff2bd6"/><circle cx="542.3" cy="274" r="6" fill="#ff2bd6"/><text x="318.2" y="175" fill="#e4f2f0" font-size="12" text-anchor="start">message at 2000 m</text><text x="554.3" y="256" fill="#e4f2f0" font-size="12" text-anchor="start">turn takes effect,</text><text x="554.3" y="270" fill="#e4f2f0" font-size="12" text-anchor="start">0 m apart</text><circle cx="483.3" cy="250.3" r="9" fill="none" stroke="#ff2bd6" stroke-width="2.5"/></g><g id="part4"><rect x="306.2" y="328" width="236.2" height="18" rx="4" fill="#ff2bd6" fill-opacity="0.55"/><text x="314.2" y="341" fill="#e4f2f0" font-size="12" text-anchor="start">turning (1000 steps)</text><circle cx="306.2" cy="337" r="5" fill="#ff2bd6"/><circle cx="542.3" cy="337" r="5" fill="#ff2bd6"/><text x="554.3" y="341" fill="#e4f2f0" font-size="12" text-anchor="start">breach near step 1750</text></g></defs>
