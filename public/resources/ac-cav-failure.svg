0</text><line x1="70" y1="131.5" x2="684" y2="131.5" stroke="rgba(0,255,200,0.10)"/><text x="60" y="135.5" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="end">3000</text><line x1="70" y1="84" x2="684" y2="84" stroke="rgba(0,255,200,0.10)"/><text x="60" y="88" fill="rgba(210,230,225,0.72)" font-size="13" text-anchor="end">4000</text><rect x="70" y="250.3" width="614" height="23.8" fill="#ff2bd6" fill-opacity="0.12"/><text x="78" y="266.1" fill="#e4f2f0" font-size="12" text-anchor="start">danger zone: separation 500 m or less</text><text x="18" y="179" fill="#e4f2f0" font-size="14" text-anchor="middle" transform="rotate(-90 18 179)">separation (m)</text><text x="377" y="416" fill="#e4f2f0" font-size="14" text-anchor="middle">simulation step (1 step = 1 m flown)</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/></g><g class="anim"><clipPath id="wipe1"><rect x="70" y="84" width="0" height="190"><animate attributeName="width" values="0;0;614;614" keyTimes="0;0.06;0.3000;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.4400;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><clipPath id="wipe2"><rect x="180.1" y="294" width="0" height="24"><animate attributeName="width" values="0;0;600;600" keyTimes="0;0.4;0.5600;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.7000;1" dur="5s" repeatCount="indefinite"/><use href="#part3"/></g><clipPath id="wipe3"><rect x="298.2" y="326" width="0" height="24"><animate attributeName="width" values="0;0;600;600" keyTimes="0;0.66;0.8000;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe3)"><use href="#part4"/></g></g></g>
