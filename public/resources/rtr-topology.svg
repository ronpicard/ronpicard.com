<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Home network behind a Linux router</title>
<desc id="d">Three LAN hosts with static leases (a wireless access point at 10.0.0.2, a VPN server at 10.0.0.3, a desktop at 10.0.0.4) connect to the LAN port enp1s0 (10.0.0.1) of an Ubuntu router running DHCP, DNS and NAT. Its WAN port enp2s0 gets an address by DHCP and masquerades outbound traffic to the internet; replies return along the same path.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="20" y="74" width="150" height="52" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="95" y="96.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">WAP</text><text x="95" y="115.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">10.0.0.2</text><rect x="20" y="140" width="150" height="52" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="95" y="162.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">VPN server</text><text x="95" y="181.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">10.0.0.3</text><rect x="20" y="206" width="150" height="52" rx="8" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="95" y="228.6" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Desktop</text><text x="95" y="247.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">10.0.0.4</text></g><g id="part1"><line x1="172" y1="100" x2="258" y2="100" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/><line x1="172" y1="166" x2="258" y2="166" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/><line x1="172" y1="232" x2="258" y2="232" stroke="#00ffc8" stroke-width="1.6" marker-end="url(#arrowT)"/></g><g id="part2"><rect x="260" y="74" width="220" height="184" rx="10" fill="rgba(0,255,200,0.07)" stroke="#00ffc8"/><text x="370" y="163.6" fill="#e4f2f0" font-size="16" text-anchor="middle" font-weight="600">Ubuntu router</text><text x="370" y="182.9" fill="rgba(210,230,225,0.72)" font-size="14" text-anchor="middle">DHCP · DNS · NAT</text><text x="262" y="280" fill="#00ffc8" font-size="12" text-anchor="start">LAN port: enp1s0</text><text x="262" y="296" fill="#00ffc8" font-size="12" text-anchor="start">address 10.0.0.1</text><text x="478" y="280" fill="#00d4ff" font-size="12" text-anchor="end">WAN port: enp2s0</text><text x="478" y="296" fill="#00d4ff" font-size="12" text-anchor="end">address by DHCP</text></g><g id="part3"><line x1="482" y1="142" x2="588" y2="142" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrowB)"/><text x="535" y="130" fill="#00d4ff" font-size="12" text-anchor="middle">NAT</text><line x1="588" y1="192" x2="482" y2="192" stroke="#ff2bd6" stroke-width="1.6" marker-end="url(#arrowM)" stroke-dasharray="5 4"/><text x="535" y="210" fill="#ff2bd6" font-size="12" text-anchor="middle">replies</text></g><g id="part4"><rect x="590" y="112" width="110" height="110" rx="10" fill="rgba(0,212,255,0.07)" stroke="#00d4ff"/><text x="645" y="172.3" fill="#e4f2f0" font-size="15" text-anchor="middle" font-weight="600">Internet</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker><marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffc8"/></marker><marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff2bd6"/></marker><marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00d4ff"/></marker></defs>
<rect width="720" height="340" fill="#05090c"/>
<g id="play"><rect x="8" y="36" width="176" height="232" rx="14" fill="none" stroke="rgba(0,255,200,0.22)" stroke-dasharray="5 5"/><text x="22" y="58" fill="rgba(210,230,225,0.4)" font-size="12" text-anchor="start" letter-spacing="2">LAN, 10.0.0.0/8</text><text x="360" y="24" fill="#e4f2f0" font-size="14" text-anchor="middle" font-weight="600">Home LAN through a Linux router to the internet</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.2200;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><clipPath id="wipe1"><rect x="170" y="80" width="0" height="190"><animate attributeName="width" values="0;0;92;92" keyTimes="0;0.22;0.3600;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe1)"><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.36;0.5200;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><clipPath id="wipe2"><rect x="480" y="110" width="0" height="110"><animate attributeName="width" values="0;0;112;112" keyTimes="0;0.52;0.6800;1" dur="5s" repeatCount="indefinite"/></rect></clipPath><g clip-path="url(#wipe2)"><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part4"/></g></g><text x="360" y="326" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="middle">Outbound packets leave with the router’s WAN address; replies come back to the clients.</text></g>
</svg>
