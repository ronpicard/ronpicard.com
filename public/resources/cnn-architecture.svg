<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The base network (Keras)</title>
<desc id="d">Flow diagram of the base convolutional network: a 28 by 28 grey-scale input; a 3 by 3 convolution with 32 filters giving 26 by 26 by 32; a 3 by 3 convolution with 64 filters giving 24 by 24 by 64; 2 by 2 max pooling to 12 by 12 by 64; dropout of 25%; flatten to 9,216 values; a dense layer of 128 ReLU units; dropout of 50%; and a 10-way softmax output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="330" fill="#05090c"/>
<text x="24" y="30" fill="#e4f2f0" font-size="17" text-anchor="start" font-weight="600">The base network (Keras)</text><rect x="24" y="64" width="150" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00d4ff"/><text x="99" y="93.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Input</text><text x="99" y="112.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">28×28×1</text><line x1="176" y1="97" x2="194" y2="97" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="196" y="64" width="150" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="271" y="93.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Conv 3×3, 32</text><text x="271" y="112.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">ReLU → 26×26×32</text><line x1="348" y1="97" x2="366" y2="97" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368" y="64" width="150" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6"/><text x="443" y="93.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Conv 3×3, 64</text><text x="443" y="112.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">ReLU → 24×24×64</text><line x1="520" y1="97" x2="538" y2="97" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="540" y="64" width="150" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="615" y="93.5" fill="#e4f2f0" font-size="13" text-anchor="middle" font-weight="600">Max pool 2×2</text><text x="615" y="112.8" fill="rgba(210,230,225,0.72)" font-size="11" text-anchor="middle">→ 12×12×64</text><path d="M615 130V150H59V186" fill="none" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="190" width="120" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="84" y="219.2" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Dropout 0.25</text><text x="84" y="238.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">drop 25%</text><line x1="146" y1="223" x2="160" y2="223" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="162" y="190" width="120" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="222" y="219.2" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Flatten</text><text x="222" y="238.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">→ 9,216</text><line x1="284" y1="223" x2="298" y2="223" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="190" width="120" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="360" y="219.2" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Dense 128</text><text x="360" y="238.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">ReLU</text><line x1="422" y1="223" x2="436" y2="223" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="438" y="190" width="120" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="rgba(0,255,200,0.22)"/><text x="498" y="219.2" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Dropout 0.5</text><text x="498" y="238.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">drop 50%</text><line x1="560" y1="223" x2="574" y2="223" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="576" y="190" width="120" height="66" rx="10" fill="rgba(0,255,200,0.035)" stroke="#00ffc8"/><text x="636" y="219.2" fill="#e4f2f0" font-size="12" text-anchor="middle" font-weight="600">Dense 10</text><text x="636" y="238.5" fill="rgba(210,230,225,0.72)" font-size="10" text-anchor="middle">softmax</text><text x="24" y="308" fill="rgba(210,230,225,0.72)" font-size="12" text-anchor="start">Trained for 20 epochs on 10,000 MNIST images and tested on 5,000 more.</text>
</svg>
