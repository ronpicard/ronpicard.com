<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">A propositional argument</title>
<desc id="d">Proposition A, all men are mortal, and proposition B, Socrates is a man, join through AND and imply proposition C, Socrates is mortal. Written formally: A and B implies C.</desc>
<defs><style>
.anim{display:none}
@media (prefers-reduced-motion:no-preference){
#play:target .anim{display:inline}
#play:target .still{display:none}
}
</style><g id="part0"><rect x="24" y="70" width="220" height="62" rx="12" fill="rgba(0,255,200,0.035)" stroke="#00ffc8" stroke-width="1.6"/><text x="38" y="94" fill="#00ffc8" font-size="15" text-anchor="start" font-weight="700">A</text><text x="38" y="116" fill="#e4f2f0" font-size="14" text-anchor="start">All men are mortal.</text></g><g id="part1"><rect x="24" y="170" width="220" height="62" rx="12" fill="rgba(0,255,200,0.035)" stroke="#00ffc8" stroke-width="1.6"/><text x="38" y="194" fill="#00ffc8" font-size="15" text-anchor="start" font-weight="700">B</text><text x="38" y="216" fill="#e4f2f0" font-size="14" text-anchor="start">Socrates is a man.</text></g><g id="part2"><line x1="244" y1="101" x2="318" y2="150" stroke="rgba(210,230,225,0.55)" stroke-width="1.6"/><line x1="244" y1="201" x2="318" y2="160" stroke="rgba(210,230,225,0.55)" stroke-width="1.6"/><circle cx="340" cy="155" r="24" fill="#0b1316" stroke="#00d4ff" stroke-width="2"/><text x="340" y="163" fill="#00d4ff" font-size="24" text-anchor="middle" font-weight="600">∧</text></g><g id="part3"><line x1="364" y1="155" x2="470" y2="155" stroke="rgba(210,230,225,0.55)" stroke-width="1.6" marker-end="url(#arrow)"/><text x="417" y="142" fill="#ffb547" font-size="20" text-anchor="middle" font-weight="700">→</text><rect x="476" y="124" width="220" height="62" rx="12" fill="rgba(0,255,200,0.035)" stroke="#ff2bd6" stroke-width="1.6"/><text x="490" y="148" fill="#ff2bd6" font-size="15" text-anchor="start" font-weight="700">C</text><text x="490" y="170" fill="#e4f2f0" font-size="14" text-anchor="start">Socrates is mortal.</text></g><g id="part4"><text x="360" y="270" fill="#e4f2f0" font-size="18" text-anchor="middle" font-weight="600">A ∧ B → C</text></g><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(210,230,225,0.55)"/></marker></defs>
<rect width="720" height="300" fill="#05090c"/>
<g id="play"><text x="24" y="34" fill="#e4f2f0" font-size="16" text-anchor="start" font-weight="600">A propositional argument</text><g class="still"><use href="#part0"/><use href="#part1"/><use href="#part2"/><use href="#part3"/><use href="#part4"/></g><g class="anim"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.2000;1" dur="5s" repeatCount="indefinite"/><use href="#part0"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.3400;1" dur="5s" repeatCount="indefinite"/><use href="#part1"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.5200;1" dur="5s" repeatCount="indefinite"/><use href="#part2"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.7000;1" dur="5s" repeatCount="indefinite"/><use href="#part3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.8000;1" dur="5s" repeatCount="indefinite"/><use href="#part4"/></g></g></g>
