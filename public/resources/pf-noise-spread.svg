<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Spread of the converged mass particles, without and with sensor noise</title>
<desc id="d">Standard deviation of the converged mass particles per trial, without noise then with noise: trial 1 20.4 then 13.32; trial 2 24.91 then 11.73; trial 3 20.62 then 178.3; trial 4 23.44 then 81.17; trial 5 36.27 then 77.78; trial 6 56.89 then 108.8. Noise lowers the spread for the 50-particle trials and raises it for the others.</desc>
