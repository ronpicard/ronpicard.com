<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Steps taken as the input size n grows</title>
<desc id="d">Growth curves for input sizes 1 to 10 on a chart whose steps axis stops at 100. log base 2 of n stays below 4 and n reaches 10. n squared reaches 100 at n = 10. n cubed passes 100 before n = 5, n factorial passes 100 at n = 5, and 2 to the n passes 100 at n = 7, so those curves leave the chart while the slower ones are still near the bottom.</desc>
